<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hair Colour · Nielsen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg1:#e6ecff;--bg2:#fde8f4;--bg3:#e2f7f0;--glass:rgba(255,255,255,.50);--glass2:rgba(255,255,255,.72);--bd:rgba(255,255,255,.7);--hi:rgba(255,255,255,.9);--txt:#1d1d1f;--mut:#6e6e73;--pos:#1fa24a;--neg:#e5303f;--warn:#c77700;--acc:#0071e3;--sh:0 12px 40px rgba(31,38,80,.12);--stick:rgba(244,246,253,.94);--grid:rgba(0,0,0,.07);--blob:.75}
[data-theme=dark]{--bg1:#090b18;--bg2:#190e24;--bg3:#06151a;--glass:rgba(44,46,64,.42);--glass2:rgba(70,72,94,.55);--bd:rgba(255,255,255,.13);--hi:rgba(255,255,255,.25);--txt:#f5f5f7;--mut:#a1a1a6;--pos:#32d74b;--neg:#ff453a;--warn:#ffb340;--acc:#0a84ff;--sh:0 12px 40px rgba(0,0,0,.5);--stick:rgba(30,32,48,.95);--grid:rgba(255,255,255,.08);--blob:.45}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",system-ui,sans-serif;font-size:14px;letter-spacing:-.011em;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed;-webkit-font-smoothing:antialiased}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:var(--blob);z-index:-1;animation:drift 24s ease-in-out infinite alternate}
.b1{width:46vw;height:46vw;background:#6f9bff;top:-12vw;left:-10vw}
.b2{width:40vw;height:40vw;background:#ff8fd0;bottom:-14vw;right:-8vw;animation-duration:30s}
.b3{width:32vw;height:32vw;background:#5fe3bd;top:35vh;left:42vw;animation-duration:36s}
@keyframes drift{to{transform:translate(8vw,6vh) scale(1.2)}}
.glass{position:relative;background:var(--glass);backdrop-filter:blur(28px) saturate(190%);-webkit-backdrop-filter:blur(28px) saturate(190%);border:1px solid var(--bd);border-radius:24px;box-shadow:var(--sh),inset 0 1px 0 var(--hi),inset 0 -1px 0 rgba(255,255,255,.06);overflow:hidden}
.glass::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,-30%),rgba(255,255,255,.26),transparent 60%)}
nav{position:sticky;top:14px;z-index:20;margin:14px auto 0;width:max-content;max-width:calc(100% - 24px);display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:99px;flex-wrap:wrap;justify-content:center}
.seg{position:relative;display:flex;padding:3px;border-radius:99px;background:rgba(120,120,140,.14)}
.seg button{position:relative;z-index:1;background:none;border:0;padding:7px 18px;border-radius:99px;font-weight:600;color:var(--mut);transition:color .25s;cursor:pointer}
.seg button.on{color:var(--txt)}
.thumb{position:absolute;top:3px;bottom:3px;border-radius:99px;background:var(--glass2);box-shadow:0 2px 10px rgba(0,0,0,.12),inset 0 1px 0 var(--hi);transition:left .4s cubic-bezier(.3,1.3,.5,1),width .4s cubic-bezier(.3,1.3,.5,1)}
button,select,input,textarea{font:inherit;color:var(--txt)}
.btn{border:1px solid var(--bd);background:var(--glass2);border-radius:99px;padding:8px 16px;font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px) scale(1.03);box-shadow:0 6px 18px rgba(0,0,0,.12)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(0,113,227,.4)}
.ico{width:36px;height:36px;padding:0;display:grid;place-items:center}
main{max-width:1700px;margin:0 auto;padding:26px 22px 60px}
.hero{margin:8px 4px 20px}
.hero h1{margin:0;font-size:clamp(28px,4vw,44px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hero p{margin:6px 0 0;color:var(--mut);font-size:15px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.filters .t{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
select,input[type=search],input[type=number],input:not([type]){border:1px solid var(--bd);background:var(--glass2);backdrop-filter:blur(14px);border-radius:99px;padding:8px 14px;outline:none}
select:focus,input:focus{box-shadow:0 0 0 3px rgba(0,113,227,.35)}
.chk{display:flex;gap:6px;align-items:center;background:var(--glass2);border:1px solid var(--bd);border-radius:99px;padding:7px 14px;cursor:pointer;font-weight:500}
.yel{background:#ffe14d;color:#111;font-weight:700;border-radius:99px;padding:7px 16px;box-shadow:0 4px 14px rgba(255,225,77,.45)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--bd);background:var(--glass2);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:12px;transition:transform .2s}
.chip:hover{transform:translateY(-2px)}.chip.on{outline:2px solid var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:18px}
.kpi{padding:20px 22px}
.kpi .n{font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.kpi .v{font-size:46px;font-weight:700;letter-spacing:-.04em;line-height:1.1;margin:6px 0 2px}
.kpi .c{font-weight:600}.kpi .r{margin-top:12px;font-size:12px;color:var(--mut)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
@media(max-width:1000px){.g2{grid-template-columns:1fr}}
.panel{padding:20px 22px}
.panel h3{margin:0 0 12px;font-size:19px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.cnt{font-size:12px;font-weight:700;background:rgba(120,120,140,.2);border-radius:99px;padding:2px 9px;color:var(--mut)}
.flag{display:flex;gap:12px;align-items:center;padding:11px 12px;margin:0 -12px;border-radius:16px;transition:background .2s,transform .25s}
.flag:hover{background:rgba(120,120,140,.12);transform:translateX(3px)}
.fl-n{flex:1;font-weight:600}.fl-s{color:var(--mut);font-size:12px;font-weight:400;margin-left:4px}
.fl-r{text-align:right;font-weight:600}.fl-r small{display:block;font-weight:500}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;margin:5px 5px 0 0;white-space:nowrap;border:1px solid transparent}
.p-neg{background:rgba(255,69,58,.16);color:var(--neg);border-color:rgba(255,69,58,.25)}
.p-pos{background:rgba(48,209,88,.16);color:var(--pos);border-color:rgba(48,209,88,.25)}
.p-warn{background:rgba(255,159,10,.17);color:var(--warn);border-color:rgba(255,159,10,.28)}
.p-info{background:rgba(10,132,255,.15);color:var(--acc);border-color:rgba(10,132,255,.25)}
.in{opacity:0;transform:translateY(16px) scale(.98);animation:in .7s cubic-bezier(.2,.9,.3,1) forwards;animation-delay:calc(var(--i,0)*70ms)}
@keyframes in{to{opacity:1;transform:none}}
.scroll{overflow:auto;max-height:72vh;border-radius:24px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{position:sticky;top:0;z-index:2;background:var(--stick);padding:12px;text-align:right;font-weight:700;font-size:12px;color:var(--mut);cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--grid)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--stick);z-index:1}
th:first-child{z-index:3}
td{padding:7px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid)}
td.fl{text-align:left;white-space:normal;min-width:190px}
tbody tr:hover td{background:rgba(120,120,140,.1)}
tr.sec td{background:rgba(120,120,140,.16)!important;font-weight:700;text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
tr.own td:first-child{font-weight:700}
/* recap */
.rc th{padding:9px 10px}
.rc thead tr:first-child th{height:38px;background:rgba(12,12,16,.92);color:#fff;text-align:center;border-left:1px solid rgba(255,255,255,.18)}
.rc thead tr:first-child th:first-child{text-align:left;border-left:0}
.rc thead tr:nth-child(2) th{top:38px;font-size:11px}
.rc thead tr:nth-child(2) th:first-child{display:none}
.rc td.sep,.rc th.sep{border-left:1px solid var(--grid)}
.rc td{min-width:66px}
.rc tr.band td{background:rgba(120,120,140,.24)!important;font-weight:700}
.rc tr.band td:first-child{background:var(--stick)!important;box-shadow:inset 0 0 0 99px rgba(120,120,140,.24)}
.rc tr.cpd td{font-weight:700}
.rc td.cf-neg{background:rgba(255,69,58,.30)!important;font-weight:700}
.rc td.cf-pos{background:rgba(48,209,88,.28)!important;font-weight:700}
.drop{display:grid;place-items:center;text-align:center;padding:90px 20px;min-height:340px}
.drop b{font-size:30px;letter-spacing:-.03em;display:block;margin-bottom:8px}
.drop span{color:var(--mut);font-size:15px}
.drop .o{width:84px;height:84px;border-radius:26px;margin:0 auto 22px;background:linear-gradient(135deg,#6f9bff,#ff8fd0);box-shadow:0 14px 40px rgba(111,155,255,.5),inset 0 2px 0 rgba(255,255,255,.6);animation:bob 4s ease-in-out infinite;display:grid;place-items:center;font-size:38px}
@keyframes bob{50%{transform:translateY(-10px) rotate(3deg)}}
body.dragging .glass{outline:3px dashed var(--acc);outline-offset:-8px}
#setp{max-height:0;overflow:hidden;opacity:0;transition:max-height .5s,opacity .4s,margin .4s}
#setp.open{max-height:420px;opacity:1;margin-bottom:18px}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:20px}
.set label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut);font-weight:600}
.set .wide{grid-column:1/-1}
dialog{border:1px solid var(--bd);border-radius:26px;width:min(720px,92vw);background:var(--glass2);backdrop-filter:blur(40px) saturate(180%);color:var(--txt);box-shadow:var(--sh);padding:22px}
dialog::backdrop{background:rgba(0,0,0,.35);backdrop-filter:blur(6px)}
textarea{width:100%;height:260px;border:1px solid var(--bd);border-radius:16px;background:rgba(120,120,140,.12);padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.note{color:var(--mut);font-size:12px}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<nav class="glass">
  <div class="seg" id="tabs"><div class="thumb" id="thumb"></div>
    <button data-t="rc" class="on">Recap</button><button data-t="ov">Flags</button><button data-t="ex">Explorer</button><button data-t="mk">Markets</button></div>
  <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
  <button class="btn pri" onclick="file.click()">Upload</button>
  <button class="btn" onclick="pd.showModal()">Paste</button>
  <button class="btn ico" title="Flag settings" onclick="$('setp').classList.toggle('open')">⚙</button>
  <button class="btn ico" id="theme" title="Theme">☾</button>
</nav>

<main>
  <div class="hero in"><h1>Hair Colour</h1><p id="sub">Upload your Nielsen workbook to begin</p></div>
  <div id="setp"><div class="glass"><div class="set" id="set"></div></div></div>
  <div id="app"><div class="glass drop in"><div><div class="o">✦</div><b>Drop your Nielsen workbook</b><span>Excel or CSV · read in your browser · nothing is uploaded anywhere</span></div></div></div>
</main>

<dialog id="pd"><h3 style="margin:0 0 12px;font-size:20px">Paste from Excel</h3><textarea id="pt" placeholder="Copy a Nielsen block (including the header rows) and paste here"></textarea>
  <div style="display:flex;gap:10px;margin-top:14px"><button class="btn pri" onclick="loadPaste()">Load</button><button class="btn" onclick="pd.close()">Close</button></div></dialog>

<script>
const $=id=>document.getElementById(id);
const PK=[['y24','2024'],['y25','2025'],['ytd','YTD'],['l13','Latest 13 Wks'],['lp','Latest Period']];
const DEF={minShr:0.3,decl:5,grow:10,minD:25000,swing:10,
 own:"CPD, L OREAL PARIS, GARNIER, PREFERENCE, EXCELLENCE, FERIA, MAGIC ROOT, COLORISTA, CASTING, COLOR GLOSS, AGE PERFECT, COULEUR EXPERTE, NUTRISSE, BELLE COLOR, OLIA, GOOD, COLOR SENSATION"};
let S=Object.assign({},DEF,JSON.parse(localStorage.getItem('hcset')||'{}'));
let M={},BM=null,fileName='',tab='rc',sortK=null,sortDir=-1,charts={},RS={i:null,dir:1};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toUpperCase().replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,' ').trim();
const isOwn=n=>S.own.split(',').map(norm).filter(Boolean).some(o=>norm(n)===o||norm(n).startsWith(o+' '));
const f1=v=>v==null?'':v.toFixed(1);
const f1d=v=>v==null?'–':v.toFixed(1);
const pc=v=>v==null?'–':(v>0?'+':'')+v.toFixed(1)+'%';
const pcx=v=>v==null?'':v.toFixed(1)+'%';
const dl=v=>v==null?'–':(v<0?'-':'+')+'$'+Math.abs(Math.round(v)).toLocaleString('en-US');
const cl=v=>v>0?'pos':v<0?'neg':'';
const heat=v=>v==null?'':`background:rgba(${v>0?'48,209,88':'255,69,58'},${Math.min(Math.abs(v)/40,1)*.26})`;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const LV0=new Set(['MASS','CPD','L OREAL PARIS','GARNIER','WELLA','CLAIROL','HENKEL','MANIC PANIC','SOLFINE','ICE CREAM','HERBATINT','SPLAT','TRESEMME','REVLON'].map(norm));
const LV2=new Set(['MAGIC ROOT COVER UP','MAGIC ROOT PERMANENT','MAGIC ROOT PRECISION','NUTRISSE CREAM','NUTRISSE ULTRA COLOR','NICE N EASY BASE','NICE N EASY PURE BRUNETTES','NICE N EASY SPFX','NATURAL INSTINCT BASE','NATURAL INSTINCTS BOLD','NATURAL INST ROOT'].map(norm));
const AGG=new Set(['MASS','CPD','L OREAL PARIS','GARNIER','WELLA','CLAIROL','HENKEL'].map(norm));
function levels(rows){const inds=[...new Set(rows.map(r=>r.ind||0))].sort((a,b)=>a-b);
 if(inds.length>1)return rows.map(r=>inds.indexOf(r.ind||0));
 return rows.map(r=>LV0.has(norm(r.name))?0:LV2.has(norm(r.name))?2:1)}

/* ---------- THEME / FX ---------- */
document.documentElement.dataset.theme=localStorage.getItem('hctheme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
function themeIcon(){$('theme').textContent=document.documentElement.dataset.theme==='dark'?'☀':'☾'}
$('theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('hctheme',t);themeIcon();if(BM||Object.keys(M).length)draw()};
themeIcon();
document.addEventListener('mousemove',e=>{const g=e.target.closest&&e.target.closest('.glass');if(!g)return;const r=g.getBoundingClientRect();g.style.setProperty('--mx',(e.clientX-r.left)+'px');g.style.setProperty('--my',(e.clientY-r.top)+'px')});
function moveThumb(){const b=document.querySelector('#tabs button.on'),t=$('thumb');t.style.left=b.offsetLeft+'px';t.style.width=b.offsetWidth+'px'}
addEventListener('load',moveThumb);addEventListener('resize',moveThumb);
function countUp(){document.querySelectorAll('[data-v]').forEach(el=>{const to=+el.dataset.v,t0=performance.now();
 (function f(t){const k=Math.min((t-t0)/900,1),e=1-Math.pow(1-k,4);el.textContent=(to*e).toFixed(1);if(k<1)requestAnimationFrame(f)})(t0)})}
function chartBase(){Chart.defaults.color=css('--mut');Chart.defaults.font.family='-apple-system,"SF Pro Text",Inter,sans-serif';Chart.defaults.borderColor=css('--grid')}

/* ---------- PARSING ---------- */
function per(s){s=s.toLowerCase();
 if(s==='2024')return'y24';if(s==='2025')return'y25';if(/^ytd/.test(s))return'ytd';
 if(/13/.test(s)&&/(latest|last|l13)/.test(s))return'l13';if(/^(latest p|lp|last p|current p)/.test(s))return'lp';return null}
function num(v){if(v==null)return null;let s=String(v).trim();if(!s||s==='-')return null;
 const neg=/^\(.*\)$/.test(s)||/^-/.test(s)||/^\$\s*-/.test(s)||/^-\s*\$/.test(s);s=s.replace(/[^0-9.]/g,'');if(!s)return null;const n=parseFloat(s);return isNaN(n)?null:(neg?-n:n)}
/* layout A: periods across (By Period) */
function parseRows(rows,dflt){
 let cur=null,sec=null,blank=false,pend=null,out=[];
 for(const r of rows){
  const c=r.map(x=>x==null?'':String(x).trim());
  const hits={};c.forEach((x,i)=>{const k=per(x);if(k&&!(k in hits))hits[k]=i});
  const mi=c.findIndex(x=>/^market$/i.test(x));
  if(mi>=0){const nm=c.slice(mi+1).find(x=>x&&!per(x));if(nm)pend=nm}
  if(Object.keys(hits).length>=3){
    cur={name:pend||dflt,starts:hits,labels:Object.fromEntries(c.map((x,i)=>[per(x),x]).filter(a=>a[0])),sections:[]};
    sec={name:'Brand & franchise',rows:[]};cur.sections.push(sec);blank=false;pend=null;out.push(cur);continue}
  if(!cur)continue;
  if(c.every(x=>x==='')){blank=true;continue}
  const name=c[0];if(!name||name==='$/Units')continue;
  const p={};let any=false;
  for(const [k] of PK){const st=cur.starts[k];if(st==null)continue;
    const o={shr:num(c[st]),chg:num(c[st+1]),d:num(c[st+2])};
    if(o.shr!=null||o.d!=null){any=true}p[k]=o}
  if(!any)continue;
  if(blank){sec={name:/^TL /i.test(name)?name:'Other',rows:[]};cur.sections.push(sec);blank=false}
  const raw0=r[0]==null?'':String(r[0]);
  sec.rows.push({name,sec:sec.name,p,ind:raw0.match(/^\s*/)[0].length})
 }
 return out}
/* layout B: markets across (By Market) */
function parseByMarket(rows){
 const c=rows.map(r=>r.map(x=>x==null?'':String(x)));
 let s=-1;for(let i=1;i<c.length;i++){if(c[i].filter(x=>/shr/i.test(x)).length>=2){s=i;break}}
 if(s<1)return null;
 const sub=c[s],head=c[s-1],cols=[];
 sub.forEach((x,j)=>{if(/shr/i.test(x)){const n=(head[j]||'').trim()||(head[j+1]||'').trim()||(head[j-1]||'').trim();cols.push({j,n:n||'Market '+(cols.length+1)})}});
 let label='Current period';
 for(let i=0;i<=s;i++){if(/^\s*period/i.test(c[i][0])){const v=c[i].slice(1).find(x=>x.trim());if(v)label=v.trim();break}}
 const out=[];
 for(let i=s+1;i<c.length;i++){const raw=c[i][0],name=raw.trim();if(!name)continue;
  const v=cols.map(({j})=>({shr:num(c[i][j]),chg:num(c[i][j+1])}));
  if(v.every(x=>x.shr==null&&x.chg==null))continue;
  out.push({name,ind:raw.match(/^\s*/)[0].length,v})}
 return out.length?{label,markets:cols.map(x=>x.n),rows:out}:null}

function ingest(blocks,bm){M={};blocks.forEach(b=>{let n=b.name,i=2;while(M[n])n=b.name+' ('+i++ +')';M[n]=b});BM=bm;
 if(!Object.keys(M).length&&!BM){alert('No Nielsen layout found. Expected either a period header row (2024 / 2025 / YTD / Latest 13 Wks / Latest Period) or a market header with "$ Shr - Product" / "$ % Chg YA" pairs.');return}
 const nm=Object.keys(M).length,parts=[];
 if(BM)parts.push(BM.markets.length+' markets · '+BM.label);
 if(nm)parts.push(nm+' period-view market(s)');
 $('sub').textContent=(fileName?fileName+' · ':'')+parts.join(' · ');
 RS={i:null,dir:1};init()}
function handleFile(f){if(!f)return;fileName=f.name;const rd=new FileReader();
 rd.onload=ev=>{const wb=XLSX.read(ev.target.result,{type:'array'});let all=[],cands=[];
  wb.SheetNames.forEach(n=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''});
   const b=parseRows(rows,n);if(b.length){all=all.concat(b)}else{const bm=parseByMarket(rows);if(bm)cands.push({n,bm})}});
  const pick=cands.find(x=>/by\s*market/i.test(x.n))||cands.find(x=>!/pull/i.test(x.n))||null;
  ingest(all,pick?pick.bm:null)};rd.readAsArrayBuffer(f)}
$('file').onchange=e=>handleFile(e.target.files[0]);
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('dragging')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('dragging')});
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('dragging');handleFile(e.dataTransfer.files[0])});
function loadPaste(){const rows=$('pt').value.split(/\r?\n/).map(l=>l.split('\t'));pd.close();fileName='Pasted data';
 const b=parseRows(rows,'Pasted market');ingest(b,b.length?null:parseByMarket(rows))}

/* ---------- FLAGS (period view) ---------- */
function flags(r,pk){
 const p=r.p[pk]||{},a=r.p.ytd||{},b=r.p.l13||{},o=[];
 const big=(p.shr||0)>=S.minShr||Math.abs(p.d||0)>=S.minD*2;if(!big||p.chg==null&&p.d==null&&pk!=='lp')return o;
 if(p.chg!=null&&p.d!=null){
  if(p.chg<=-S.decl&&p.d<=-S.minD)o.push({c:'neg',t:'Losing'});
  if(p.chg>=S.grow&&p.d>=S.minD)o.push({c:'pos',t:'Surging'})}
 if(pk==='lp'||pk==='l13'){
  if(a.chg!=null&&p.chg!=null){if(a.chg>0&&p.chg<0&&Math.abs(p.d||0)>=S.minD/2)o.push({c:'warn',t:'Turned negative'});
   if(a.chg<0&&p.chg>0&&Math.abs(p.d||0)>=S.minD/2)o.push({c:'pos',t:'Turned positive'})}
  const base=pk==='lp'?b:a;if(base.chg!=null&&p.chg!=null&&Math.abs(p.d||0)>=S.minD/2){
   const dd=p.chg-base.chg;if(dd>=S.swing)o.push({c:'info',t:'Accelerating'});if(dd<=-S.swing)o.push({c:'warn',t:'Decelerating'})}}
 if(!(r.p.y25&&r.p.y25.shr)&&p.shr>0&&r.p.ytd)o.push({c:'info',t:'New'});
 return o}
const pill=f=>`<span class="pill p-${f.c}">${f.t}</span>`;
const ARR=m=>M[m].sections.flatMap(s=>s.rows);
const fc=x=>x&&x.chg!=null&&(x.shr||0)>=S.minShr?(x.chg<=-S.decl?'cf-neg':x.chg>=S.grow?'cf-pos':''):'';

/* ---------- UI SHELL ---------- */
const hasM=()=>Object.keys(M).length>0;
function init(){
 $('app').innerHTML=`<div class="filters in" id="bar"></div><div id="view"></div>`;
 const ms=Object.keys(M);let po;
 if(hasM()){const lab=M[ms[0]].labels;po=PK.slice(2).reverse().map(([k,l])=>`<option value="${k}">${esc(lab[k]||l)}</option>`).join('')}
 else po=`<option value="lp">${esc(BM.label)}</option>`;
 $('bar').innerHTML=`<span id="mkw" style="display:contents"><span class="t">Market</span><select id="mk" onchange="draw()">${ms.map(m=>`<option>${esc(m)}</option>`).join('')}</select></span>
 <span class="t">Period</span><select id="pk" onchange="draw()">${po}</select>
 <label class="chk" id="ownw"><input type="checkbox" id="ownOnly" checked onchange="draw()"> Own brands</label>`;
 draw()}
function sets(){const f=[['minShr','Min share (pts)'],['decl','Decline % ≥'],['grow','Growth % ≥'],['minD','Min $ change'],['swing','Swing (pts)']];
 $('set').innerHTML=f.map(([k,l])=>`<label>${l}<input type="number" step="any" value="${S[k]}" onchange="S['${k}']=+this.value;save()"></label>`).join('')+
 `<label class="wide">Own-brand list (comma separated)<input value="${esc(S.own)}" onchange="S.own=this.value;save()"></label>`}
function save(){localStorage.setItem('hcset',JSON.stringify(S));if(BM||hasM())draw()}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));moveThumb();if(BM||hasM())draw()});
function draw(){Object.values(charts).forEach(c=>c.destroy());charts={};chartBase();
 $('mkw').style.display=(tab==='ov'||tab==='ex')?'contents':'none';
 $('ownw').style.display=tab==='ov'?'flex':'none';
 if((tab==='ov'||tab==='ex')&&!hasM()){$('view').innerHTML=`<div class="glass panel in"><h3>This view needs period data</h3><div class="note">Your file only contains the By Market layout (one period). Include the By Period sheet, or the raw pull, to unlock Flags and Explorer across 2024 / 2025 / YTD / 13 weeks / latest period.</div></div>`;return}
 const m=hasM()?$('mk').value:null,pk=$('pk').value;
 ({rc:recapView,ov:overview,ex:explorer,mk:compare}[tab])(m,pk)}

/* ---------- RECAP (Excel "By Market" replica) ---------- */
function recap(pk){
 const ms=Object.keys(M);
 if(BM&&(!ms.length||(ms.length<2&&pk==='lp')))return{label:BM.label,markets:BM.markets,rows:BM.rows};
 const base=M[ms[0]].sections[0].rows;
 return{label:M[ms[0]].labels[pk]||pk,markets:ms,rows:base.map(r=>({name:r.name,ind:r.ind,v:ms.map(mn=>{const x=M[mn].sections[0].rows.find(q=>norm(q.name)===norm(r.name));return x&&x.p[pk]?x.p[pk]:{}})}))}}
function sortM(i){if(RS.i===i){if(RS.dir===1)RS.dir=-1;else RS.i=null}else{RS.i=i;RS.dir=1}draw()}
function recapView(m,pk){
 const R=recap(pk),lv=levels(R.rows);let idx=R.rows.map((_,i)=>i);
 const q=($('rq')||{}).value||'',fo=($('rfo')||{}).checked,fl=!$('rfl')||$('rfl').checked,ro=($('rown')||{}).checked;
 if(RS.i!=null)idx.sort((a,b)=>{const f=i=>{const c=R.rows[i].v[RS.i].chg;return c==null?-1e9:c};return RS.dir*(f(b)-f(a))});
 const chips=R.markets.map((n,k)=>{let ng=0,ps=0;R.rows.forEach((r,i)=>{if(lv[i]<1)return;const c=fc(r.v[k]);if(c==='cf-neg')ng++;if(c==='cf-pos')ps++});
  return`<button class="chip ${RS.i===k?'on':''}" onclick="sortM(${k})"><b>${esc(n)}</b> <span class="neg">▼${ng}</span> <span class="pos">▲${ps}</span></button>`}).join('');
 let body='';
 idx.forEach(i=>{const r=R.rows[i],L=lv[i];
  if(q&&!r.name.toLowerCase().includes(q.toLowerCase()))return;
  if(ro&&!isOwn(r.name)&&L>0)return;
  const fcells=R.markets.map((_,k)=>fc(r.v[k]));if(fo&&!fcells.some(Boolean))return;
  const cls=(L===0&&norm(r.name)!=='CPD'?'band':'')+(norm(r.name)==='CPD'?' cpd':'');
  body+=`<tr class="${cls}"><td style="padding-left:${12+(RS.i!=null?0:L)*18}px">${esc(r.name)}</td>${R.markets.map((_,k)=>{const x=r.v[k]||{};
   return`<td class="sep">${f1(x.shr)}</td><td class="${cl(x.chg)} ${fl?fcells[k]:''}">${pcx(x.chg)}</td>`}).join('')}</tr>`});
 $('view').innerHTML=`<div class="filters in"><span class="t">Period</span><span class="yel">${esc(R.label)}</span><span class="t">$</span>
  <input type="search" id="rq" placeholder="Search…" value="${esc(q)}" oninput="recapView(null,$('pk').value)">
  <label class="chk"><input type="checkbox" id="rfl" ${fl?'checked':''} onchange="draw()"> Flags</label>
  <label class="chk"><input type="checkbox" id="rfo" ${fo?'checked':''} onchange="draw()"> Flagged rows only</label>
  <label class="chk"><input type="checkbox" id="rown" ${ro?'checked':''} onchange="draw()"> Own brands</label>
  <button class="btn" onclick="RS.i=null;draw()">Reset order</button><button class="btn" onclick="csvRecap()">Export CSV</button></div>
  <div class="chips in" style="--i:1">${chips}</div>
  <div class="glass in" style="--i:2"><div class="scroll"><table class="rc"><thead><tr><th rowspan="2">Franchise</th>${R.markets.map((n,k)=>`<th colspan="2" onclick="sortM(${k})">${esc(n)}</th>`).join('')}</tr>
  <tr><th></th>${R.markets.map(()=>`<th class="sep">$ Shr</th><th>$ % Chg YA</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div></div>
  <div class="note" style="margin-top:10px">Flag rule: share ≥ ${S.minShr} pts and % Chg YA ≤ −${S.decl}% (red) or ≥ +${S.grow}% (green). Change thresholds in ⚙. Click a market to sort by its % Chg.</div>`;
 const rq=$('rq');if(q){rq.focus();rq.setSelectionRange(q.length,q.length)}}
function csvRecap(){const R=recap($('pk').value);const o=[['Franchise',...R.markets.flatMap(n=>[n+' Shr',n+' %Chg'])]];
 R.rows.forEach(r=>o.push([r.name,...R.markets.flatMap((_,k)=>[(r.v[k]||{}).shr??'',(r.v[k]||{}).chg??''])]));dlCsv(o,'nielsen_recap.csv')}
function dlCsv(o,n){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'}));a.download=n;a.click()}

/* ---------- FLAGS TAB ---------- */
function spark(r){const ks=['y25','ytd','l13','lp'],v=ks.map(k=>(r.p[k]||{}).chg),mx=Math.max(1,...v.map(x=>Math.abs(x||0)));
 return`<svg width="${ks.length*16}" height="34">${v.map((x,i)=>{const h=Math.max(2,Math.abs(x||0)/mx*15);return`<rect x="${i*16}" y="${x>=0?17-h:17}" width="11" height="${h}" rx="3" fill="${(x||0)>=0?css('--pos'):css('--neg')}" opacity="${.45+.55*(i+1)/ks.length}"/>`}).join('')}</svg>`}
function overview(m,pk){
 const rows=ARR(m),lab=M[m].labels,first=M[m].sections[0].rows;
 const pick=n=>first.find(r=>norm(r.name)===norm(n))||rows.find(r=>norm(r.name)===norm(n));
 const cards=['CPD','L OREAL PARIS','GARNIER','CLAIROL'].map(pick).filter(Boolean).map((r,i)=>{const p=r.p[pk]||{};
  return`<div class="glass kpi in" style="--i:${i}"><div class="n">${esc(r.name)}</div><div class="v"><span data-v="${p.shr??0}">0</span></div>
  <div class="c ${cl(p.chg)}">${pc(p.chg)} <span style="color:var(--mut);font-weight:500">vs YA · ${dl(p.d)}</span></div>
  <div class="r">${spark(r)}<div>25 · YTD · 13W · LP</div></div></div>`}).join('');
 const own=$('ownOnly').checked,seen=new Set(),F=[];
 rows.forEach(r=>{const k=r.sec+'|'+norm(r.name);if(seen.has(k))return;seen.add(k);if(own&&!isOwn(r.name))return;const f=flags(r,pk);if(f.length)F.push({r,f})});
 const seenN=new Set(),FF=F.filter(x=>{const k=norm(x.r.name)+x.f.map(y=>y.t).join();if(seenN.has(k))return false;seenN.add(k);return true})
  .sort((a,b)=>Math.abs((b.r.p[pk]||{}).d||0)-Math.abs((a.r.p[pk]||{}).d||0));
 const item=x=>{const p=x.r.p[pk]||{};return`<div class="flag"><div class="fl-n">${esc(x.r.name)}<span class="fl-s">${esc(x.r.sec)}</span><div>${x.f.map(pill).join('')}</div></div>
  <div class="fl-r">${f1d(p.shr)} <span style="color:var(--mut);font-weight:500">shr</span><small class="${cl(p.chg)}">${pc(p.chg)} · ${dl(p.d)}</small></div></div>`};
 const bad=FF.filter(x=>x.f.some(y=>y.c==='neg'||y.c==='warn')),good=FF.filter(x=>!bad.includes(x));
 const mv=[],sn=new Set();rows.forEach(r=>{const n=norm(r.name);if(sn.has(n)||AGG.has(n)||/^TL /.test(n))return;sn.add(n);if(own&&!isOwn(r.name))return;const d=(r.p[pk]||{}).d;if(d!=null)mv.push([r.name,d])});
 mv.sort((a,b)=>b[1]-a[1]);const top=[...mv.slice(0,8),...mv.slice(-8)].filter((x,i,a)=>a.indexOf(x)===i);
 $('view').innerHTML=`<div class="kpis">${cards}</div>
 <div class="g2"><div class="glass panel in" style="--i:4"><h3>Needs attention <span class="cnt">${bad.length}</span></h3>${bad.slice(0,12).map(item).join('')||'<div class="note">Nothing flagged</div>'}</div>
 <div class="glass panel in" style="--i:5"><h3>Momentum &amp; wins <span class="cnt">${good.length}</span></h3>${good.slice(0,12).map(item).join('')||'<div class="note">Nothing flagged</div>'}</div></div>
 <div class="glass panel in" style="--i:6"><h3>Top $ movers vs YA · ${esc(lab[pk]||pk)}</h3><canvas id="ch" height="90"></canvas></div>`;
 countUp();
 charts.a=new Chart($('ch'),{type:'bar',data:{labels:top.map(x=>x[0]),datasets:[{data:top.map(x=>x[1]),backgroundColor:top.map(x=>x[1]>=0?css('--pos'):css('--neg')),borderRadius:10,borderSkipped:false}]},
  options:{animation:{duration:1100,easing:'easeOutQuart'},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>dl(c.raw)}}},scales:{y:{ticks:{callback:v=>dl(v)}},x:{grid:{display:false},ticks:{maxRotation:60}}}}})}

/* ---------- EXPLORER ---------- */
function explorer(m,pk){
 const secs=M[m].sections;
 $('view').innerHTML=`<div class="filters in"><span class="t">Section</span><select id="sec" onchange="tbl()"><option value="">All</option>${secs.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select>
 <span class="t">Metric</span><select id="met" onchange="tbl()"><option value="chg">% Chg YA</option><option value="shr">$ Share</option><option value="d">$ Chg YA</option></select>
 <input type="search" id="q" placeholder="Search franchise…" oninput="tbl()"><label class="chk"><input type="checkbox" id="fo" onchange="tbl()"> Flagged only</label>
 <button class="btn" onclick="csv()">Export CSV</button></div><div class="glass in" style="--i:1"><div class="scroll"><table id="t"></table></div></div>`;tbl()}
function tbl(){const m=$('mk').value,pk=$('pk').value,met=$('met').value,q=$('q').value.toLowerCase(),sv=$('sec').value,fo=$('fo').checked,lab=M[m].labels;
 const fm=met==='chg'?pc:met==='shr'?f1d:dl;
 let h=`<thead><tr><th>Franchise</th>${PK.map(([k,l])=>`<th onclick="sortK='${k}';sortDir*=-1;tbl()">${esc(lab[k]||l)}${sortK===k?(sortDir<0?' ↓':' ↑'):''}</th>`).join('')}<th style="text-align:left">Flags · ${esc(lab[pk]||pk)}</th></tr></thead><tbody>`;
 M[m].sections.forEach(s=>{if(sv&&s.name!==sv)return;let rs=s.rows.filter(r=>(!q||r.name.toLowerCase().includes(q)));
  rs=rs.map(r=>({r,f:flags(r,pk)})).filter(x=>!fo||x.f.length);
  if(sortK)rs.sort((a,b)=>sortDir*(((a.r.p[sortK]||{})[met]??-1e15)-((b.r.p[sortK]||{})[met]??-1e15))*-1);
  if(!rs.length)return;h+=`<tr class="sec"><td colspan="${PK.length+2}">${esc(s.name)}</td></tr>`;
  rs.forEach(({r,f})=>{h+=`<tr class="${isOwn(r.name)?'own':''}"><td>${esc(r.name)}</td>${PK.map(([k])=>{const v=(r.p[k]||{})[met];
   return`<td class="${met==='shr'?'':cl(v)}" style="${met==='shr'?'':heat((r.p[k]||{}).chg)}">${fm(v)}</td>`}).join('')}<td class="fl">${f.map(pill).join('')}</td></tr>`})});
 $('t').innerHTML=h+'</tbody>'}
function csv(){const m=$('mk').value,pk=$('pk').value;const o=[['Market','Section','Franchise',...PK.flatMap(([k,l])=>[l+' Shr',l+' %Chg',l+' $Chg']),'Flags']];
 M[m].sections.forEach(s=>s.rows.forEach(r=>o.push([m,s.name,r.name,...PK.flatMap(([k])=>{const p=r.p[k]||{};return[p.shr??'',p.chg??'',p.d??'']}),flags(r,pk).map(x=>x.t).join('; ')])));dlCsv(o,'nielsen_flags.csv')}

/* ---------- MARKETS (works from the recap data) ---------- */
function compare(m,pk){
 const R=recap(pk);const names=R.rows.map(r=>r.name);
 $('view').innerHTML=`<div class="filters in"><span class="t">Franchise</span><input id="it" list="dl" value="${esc(names.find(n=>norm(n)==='CPD')||names[0])}" onchange="cmp()"><datalist id="dl">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist><span class="yel">${esc(R.label)}</span></div>
 <div class="g2"><div class="glass panel in" style="--i:1"><h3>% Chg YA by market</h3><canvas id="ch" height="170"></canvas></div><div class="glass panel in" style="--i:2"><h3>Detail</h3><div id="ct"></div></div></div>`;cmp()}
function cmp(){const pk=$('pk').value,n=norm($('it').value),R=recap(pk);charts.c&&charts.c.destroy();
 const r=R.rows.find(x=>norm(x.name)===n);if(!r){$('ct').innerHTML='<div class="note">Not found.</div>';return}
 const rs=R.markets.map((mn,k)=>({m:mn,p:r.v[k]||{}})),b=rs[0],gap=x=>x===b||x.p.shr==null||b.p.shr==null?'–':((x.p.shr-b.p.shr>0?'+':'')+(x.p.shr-b.p.shr).toFixed(1));
 const hasD=rs.some(x=>x.p.d!=null);
 $('ct').innerHTML=`<table><thead><tr><th>Market</th><th>Share</th><th>Gap vs 1st</th><th>% Chg</th>${hasD?'<th>$ Chg</th>':''}</tr></thead><tbody>${rs.map(x=>`<tr><td>${esc(x.m)}</td><td>${f1d(x.p.shr)}</td><td>${gap(x)}</td><td class="${cl(x.p.chg)}">${pc(x.p.chg)}</td>${hasD?`<td class="${cl(x.p.d)}">${dl(x.p.d)}</td>`:''}</tr>`).join('')}</tbody></table>`;
 charts.c=new Chart($('ch'),{type:'bar',data:{labels:rs.map(x=>x.m),datasets:[{data:rs.map(x=>x.p.chg),backgroundColor:rs.map(x=>(x.p.chg||0)>=0?css('--pos'):css('--neg')),borderRadius:12,borderSkipped:false}]},options:{animation:{duration:900},plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>v+'%'}},x:{grid:{display:false},ticks:{maxRotation:50}}}}})}
sets();
</script>
