<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hair Colour Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{--bg:#f4f5f9;--bg2:#eef0f7;--card:#ffffff;--card2:#f7f8fb;--bd:#e3e5ee;--txt:#15161a;--mut:#6b6f7b;--faint:#9a9eab;--pos:#16833c;--neg:#d12c3a;--warn:#b36b00;--acc:#2b59e6;--acc2:#e9eefe;--cpd:#2b59e6;--sh:0 1px 2px rgba(20,22,40,.05),0 6px 24px rgba(20,22,40,.06);--grid:rgba(0,0,0,.07);--posbg:rgba(22,131,60,.10);--negbg:rgba(209,44,58,.10);--paper:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f13;--bg2:#14161c;--card:#181a21;--card2:#1e2129;--bd:#2a2d37;--txt:#eef0f4;--mut:#a0a4b0;--faint:#70747f;--pos:#3ccf6e;--neg:#ff5d68;--warn:#ffb340;--acc:#6f8fff;--acc2:#1f2846;--cpd:#6f8fff;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 30px rgba(0,0,0,.35);--grid:rgba(255,255,255,.08);--posbg:rgba(60,207,110,.13);--negbg:rgba(255,93,104,.13);--paper:#1b1d24}}
:root[data-theme="dark"]{--bg:#0e0f13;--bg2:#14161c;--card:#181a21;--card2:#1e2129;--bd:#2a2d37;--txt:#eef0f4;--mut:#a0a4b0;--faint:#70747f;--pos:#3ccf6e;--neg:#ff5d68;--warn:#ffb340;--acc:#6f8fff;--acc2:#1f2846;--cpd:#6f8fff;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 30px rgba(0,0,0,.35);--grid:rgba(255,255,255,.08);--posbg:rgba(60,207,110,.13);--negbg:rgba(255,93,104,.13);--paper:#1b1d24}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--bg);color:var(--txt);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.bar{max-width:1500px;margin:0 auto;padding:10px 20px;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
#ctl select{max-width:190px}
.brand{font-weight:700;letter-spacing:-.02em;font-size:16px;display:flex;align-items:center;gap:8px;margin-right:6px}
.brand i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#6b4bff,#ff6fae 60%,#ffb35c);display:inline-block}
.tabs{display:flex;gap:2px;background:var(--card2);border:1px solid var(--bd);padding:3px;border-radius:10px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;color:var(--mut);cursor:pointer}
.tabs button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs button:disabled{opacity:.4;cursor:default}
.sp{flex:1}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:9px;padding:7px 13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctl label{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;display:flex;gap:6px;align-items:center}
select,input[type=text],input[type=search]{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:6px 9px;max-width:100%}
main{max-width:1500px;margin:0 auto;padding:18px 20px 80px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh)}
.pad{padding:18px 20px}
h2{font-size:22px;letter-spacing:-.02em;margin:0 0 4px}
h3{font-size:15px;margin:0 0 10px;letter-spacing:-.01em}
.mut{color:var(--mut)}.faint{color:var(--faint)}.sm{font-size:12px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:980px){.g2{grid-template-columns:1fr}}
.kpi .n{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:4px 0 2px}
.kpi .c{font-size:13px;font-weight:600}
.drop{border:2px dashed var(--bd);border-radius:18px;padding:60px 20px;text-align:center;background:var(--card)}
.drop b{font-size:20px;display:block;margin-bottom:6px;letter-spacing:-.02em}
body.dragging .drop{border-color:var(--acc);background:var(--acc2)}
.files{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--bd);background:var(--card2);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600}
.tag.ok::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pos)}
.tag.no::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.src{display:inline-block;font-size:10px;font-weight:700;color:var(--acc);background:var(--acc2);border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px;letter-spacing:.02em}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;margin:0 3px 0 0;white-space:nowrap}
.p-pos{background:var(--posbg);color:var(--pos)}.p-neg{background:var(--negbg);color:var(--neg)}.p-new{background:var(--acc2);color:var(--acc)}.p-warn{background:rgba(179,107,0,.12);color:var(--warn)}
/* note */
.notewrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media(max-width:1100px){.notewrap{grid-template-columns:1fr}}
.paper{background:var(--paper);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);padding:34px 40px;max-width:1000px;font-size:13.5px;line-height:1.5;outline:none}
@media(max-width:640px){.paper{padding:20px 16px}}
.paper h1{font-size:22px;margin:0 0 2px;letter-spacing:-.02em}
.paper .meta{color:var(--mut);font-size:12px;margin-bottom:18px}
.paper h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:22px 0 4px;color:var(--acc);border-bottom:2px solid var(--acc);padding-bottom:4px;display:flex;justify-content:space-between;gap:10px}
.paper h4 small{color:var(--mut);font-weight:600;letter-spacing:.02em;text-transform:none}
.paper h5{font-size:13px;margin:12px 0 2px}
.paper p.lead{margin:8px 0;font-weight:600}
.paper ul{margin:4px 0 4px;padding-left:20px}
.paper li{margin:3px 0}
.paper li ul{margin:2px 0}
.paper hr{border:0;border-top:1px dashed var(--bd);margin:16px 0}
.paper .k{font-weight:700}
.side .card{margin-bottom:14px}
.side ul{padding-left:18px;margin:6px 0}
.side li{margin:4px 0}
/* tables */
.tw{overflow:auto;max-height:72vh;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:6px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--bd)}
th{position:sticky;top:0;background:var(--card2);z-index:2;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
th:first-child{z-index:3;background:var(--card2)}
tr:hover td{background:var(--card2)}
tr.grp td{background:var(--card2);font-weight:700;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em;text-align:left}
td.l{text-align:left}
.tw.wrap td:first-child{white-space:normal;min-width:220px}
.tree{cursor:pointer;display:inline-block;width:16px;color:var(--faint)}
.lv0 td:first-child{font-weight:700}.lv1 td:first-child{font-weight:600}
.cpd td:first-child{box-shadow:inset 3px 0 0 var(--cpd)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:1px 8px;font-size:11px;font-weight:600;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chartbox{position:relative;height:300px}
.seglist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:14px}
.bars .row{display:grid;grid-template-columns:150px 1fr 70px;gap:8px;align-items:center;margin:5px 0;font-size:12.5px}
.bars .track{height:10px;background:var(--card2);border-radius:99px;position:relative;overflow:hidden}
.bars .fill{position:absolute;top:0;bottom:0;border-radius:99px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
.loading{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:90;place-items:center}
.loading.on{display:grid}
.loading div{background:var(--card);padding:18px 24px;border-radius:12px;font-weight:600;box-shadow:var(--sh)}
.hint{font-size:12px;color:var(--mut);margin:6px 0 12px}
details summary{cursor:pointer;font-weight:600}
@media print{header,.side,.noprint{display:none!important}main{padding:0;max-width:none}.notewrap{display:block}.paper{border:0;box-shadow:none;padding:0;max-width:none}body{background:#fff}}
</style>
</head>

  <button class="btn" id="theme" title="Toggle light/dark">Theme</button>
</div></header>
<main id="app"></main>
<div class="toast" id="toast"></div>

 const sk=ST.sort.k,dir=ST.sort.dir;const sv=p=>{const x=get(p);if(!x)return-1e18;return sk==='ydp'?(get(p,ST.mkt,'y')?.dp??-1e18):(x[sk]??-1e18)};
 const match=p=>!q||p.includes(q)||pretty(p).toUpperCase().includes(q)||fullName(p).toUpperCase().includes(q);
 const subtreeMatch=p=>match(p)||children(p).some(subtreeMatch);
 const walk=(p,lv)=>{const x=get(p);if(!x)return;if(q&&!subtreeMatch(p))return;const kids=children(p).filter(c=>get(c));
  rows.push({p,lv,x,kids:kids.length});if((ST.open.has(p)||q)&&kids.length)rankBy(kids,sv,dir).forEach(c=>walk(c,lv+1))};
 walk('MASS',0);
 $('app').innerHTML=`<div class="ctl noprint" style="margin-bottom:10px"><input type="search" id="q" placeholder="Search brand or franchise…" value="${esc(ST.q)}" style="width:260px"><button class="btn sm" id="xall">Expand all</button><button class="btn sm" id="call">Collapse</button><span class="hint" style="margin:0">${esc(mlabel(ST.mkt))} · ${esc(perLabel(ST.per))} · click headers to sort · blue bar = CPD</span></div>
 <div class="tw"><table><thead><tr><th data-k="name">Brand / franchise</th>${COLS.map(c=>`<th data-k="${c[0]}">${c[1]}${ST.sort.k===c[0]?(dir<0?' ↓':' ↑'):''}</th>`).join('')}<th>Flags</th></tr></thead><tbody>${rows.map(r=>`<tr class="lv${Math.min(r.lv,2)} ${isCPD(r.p)?'cpd':''}"><td style="padding-left:${10+r.lv*18}px"><span class="tree" data-p="${esc(r.p)}">${r.kids?(ST.open.has(r.p)||q?'▾':'▸'):''}</span>${esc(r.lv>=2&&kb(r.p).l!=='B'?pretty(r.p):pretty(r.p))}</td>${COLS.map(c=>`<td>${c[2](r.x,r.p)}</td>`).join('')}<td class="l">${flagsOf(r.x)}</td></tr>`).join('')}</tbody></table></div>`;
 $('q').oninput=e=>{ST.q=e.target.value;const pos=e.target.selectionStart;renderBrands();const n=$('q');n.focus();n.setSelectionRange(pos,pos)};
 $('xall').onclick=()=>{ST.prods.forEach(p=>ST.open.add(p));ST.open.add('REST OF MARKET');renderBrands()};
 $('call').onclick=()=>{ST.open=new Set(['MASS']);renderBrands()};
 document.querySelectorAll('.tree').forEach(t=>t.onclick=()=>{const p=t.dataset.p;ST.open.has(p)?ST.open.delete(p):ST.open.add(p);renderBrands()});
 document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(k==='name')return;ST.sort=ST.sort.k===k?{k,dir:-ST.sort.dir}:{k,dir:-1};renderBrands()})}

/* ===================== MARKETS (player x market matrix) ===================== */
const MXM={dp:['$ % chg',x=>x.dp,sp],up:['Units % chg',x=>x.up,sp],ds:['$ share',x=>x.ds,f1],dsc:['$ share chg (pts)',x=>x.dsc,v=>fin(v)?(v>=0?'+':'')+v.toFixed(1):'n/a'],ctg:['CTG % (within market)',x=>x.ctg,f1],prp:['Avg $/unit % chg',x=>x.prp,sp]};
function renderMarkets(){const def=['MASS','CPD','L OREAL PARIS','GARNIER','WELLA','HENKEL','REST OF MARKET','JUST FOR MEN','MANIC PANIC'].filter(has);
 const players=(ST.mxPlayers||def).filter(has);const[mn,mf,mfmt]=MXM[ST.mxMetric];const ms=ST.mkts.slice().sort((a,b)=>mgroup(a).localeCompare(mgroup(b)));
 const heat=(v,metric)=>{if(!fin(v))return'';if(metric==='ds')return'';const s=metric==='dsc'?v/3:metric==='ctg'?v/60:v/25;const a=Math.min(Math.abs(s),1)*.32;return`background:rgba(${v>0?'22,160,70':'220,50,60'},${a})`};
 let g='';const N=get('MASS',ST.nat);
 $('app').innerHTML=`<div class="ctl noprint" style="margin-bottom:10px"><label>Metric <select id="mxm">${Object.entries(MXM).map(([k,v])=>`<option value="${k}" ${k===ST.mxMetric?'selected':''}>${v[0]}</option>`).join('')}</select></label>
 <label>Add player <select id="mxa"><option value="">—</option>${ST.prods.filter(p=>/^[MBFS]$/.test(kb(p).l)&&!players.includes(p)).map(p=>`<option value="${esc(p)}">${esc(fullName(p))}</option>`).join('')}</select></label><button class="btn sm" id="mxr">Reset players</button><span class="hint" style="margin:0">${esc(perLabel(ST.per))} · click a column header to remove it</span></div>
 <div class="tw wrap"><table><thead><tr><th>Market</th><th>% of national $</th>${players.map(p=>`<th data-rm="${esc(p)}" title="Remove">${esc(p==='MASS'?'Mass':pretty(p).replace(' (Schwarzkopf)','').replace(' (Clairol)',''))}</th>`).join('')}</tr></thead><tbody>
 ${ms.map(m=>{const grp=mgroup(m);let h='';if(grp!==g){g=grp;h=`<tr class="grp"><td colspan="${players.length+2}">${grp.slice(2)}</td></tr>`}const T=get('MASS',m);
  return h+`<tr><td>${esc(mlabel(m))}</td><td>${T&&N?f1(T.d/N.d*100):''}</td>${players.map(p=>{const x=get(p,m);const v=x?mf(x):null;return`<td style="${heat(v,ST.mxMetric)}">${x?(x.isNew&&/dp|up/.test(ST.mxMetric)?'NEW':mfmt(v)):''}</td>`}).join('')}</tr>`}).join('')}</tbody></table></div>`;
 $('mxm').onchange=e=>{ST.mxMetric=e.target.value;renderMarkets()};
 $('mxa').onchange=e=>{if(e.target.value){ST.mxPlayers=[...players,e.target.value];renderMarkets()}};
 $('mxr').onclick=()=>{ST.mxPlayers=null;renderMarkets()};
 document.querySelectorAll('th[data-rm]').forEach(th=>th.onclick=()=>{ST.mxPlayers=players.filter(p=>p!==th.dataset.rm);renderMarkets()})}

/* ===================== KNOWLEDGE ===================== */
function renderKB(){const uni=ST.universe;const tracked=new Set(ST.prods);
 const L={T:'Total',M:'Manufacturer',B:'Brand',F:'Franchise',S:'Sub-franchise',X:'Segment',XM:'Mfr × segment',XB:'Brand × segment'};
 const lines=(ST.prods.length?ST.prods:Object.keys(KB)).map(kb);
 const ub={};for(const[b,s,v]of uni){(ub[b]??={b,tot:0,subs:[]});ub[b].tot+=v;ub[b].subs.push([s,v])}
 const ubs=Object.values(ub).sort((a,b)=>b.tot-a.tot);const utot=ubs.reduce((a,b)=>a+b.tot,0);
 const inTL=n=>tracked.has(n)||[...tracked].some(t=>kb(t).b===n);
 $('app').innerHTML=`<div class="grid g2">
 <div class="card pad"><h3>Hierarchy & segment map ${ST.prods.length?`<span class="faint sm">(${ST.prods.length} lines in file)</span>`:''}</h3>
  <div class="hint">How each line in the TL file is understood. Segment chips = which franchises compete in each segment (drives winners/drainers and launch incrementality in the note). ${ST.deckSeg?'Loaded from the deck’s By Period sheet.':'Defaults mirror the deck’s By Period sheet.'} Click to change — saved in this browser.</div>
  <div class="ctl" style="margin-bottom:8px"><input type="search" id="kq" placeholder="Filter…" style="width:220px"><button class="btn sm" id="kres">Reset to defaults</button></div>
  <div class="tw wrap"><table id="kt"><thead><tr><th>Line</th><th>Level</th><th>Brand</th><th>Manufacturer</th><th>Parent</th><th style="text-align:left">Segments</th></tr></thead><tbody>${lines.map(e=>`<tr data-n="${esc(e.n)}"><td>${esc(pretty(e.n))}${e.src==='inferred'?' <span class="pill p-warn">inferred</span>':''}</td><td>${L[e.l]||e.l}</td><td>${e.b?esc(BRANDPRETTY(e.b)):''}</td><td>${/^[BFS]$/.test(e.l)?esc(pretty(mfOf(e.n)||'')):''}</td><td>${e.p?esc(pretty(e.p)):''}</td><td class="l">${/^[BFS]$|^XB$/.test(e.l)?`<div class="chips">${SEGS.map(s=>`<span class="chip ${(SEGMEM[s.k]||[]).includes(e.n)?'on':''}" data-s="${s.k}">${s.name}</span>`).join('')}</div>`:(SEGS.find(s=>s.row===e.n)?'<span class="mut">segment total · '+(segCands(SEGS.find(s=>s.row===e.n).k).length)+' members</span>':'')}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="card pad"><h3>Brand universe <span class="faint sm">${ST.uniFile?esc(ST.uniFile):'built-in · NielsenIQ L52W to 24/10/26'} · $${big(utot)}</span></h3>
  <div class="hint">All brands and sub-brands/franchises in Canadian hair colour. Upload a newer "BRAND / SUB BRAND / $" table to refresh. Green = tracked as a line in the TL file.</div>
  <div class="tw wrap"><table><thead><tr><th>Brand / sub-brand</th><th>$ L52W</th><th>% of HC</th><th>Owner</th></tr></thead><tbody>${ubs.map(u=>`<tr class="lv0"><td><span class="tag ${inTL(u.b)||tracked.has(u.b)?'ok':'no'}">${esc(BRANDPRETTY(u.b))}</span></td><td>$${big(u.tot)}</td><td>${(u.tot/utot*100).toFixed(2)}</td><td class="l">${esc(OWNER[mfOf(u.b)]||OWNER[u.b]||(u.b==='SCHWARZKOPF'||u.b==='GOT 2B'?'Henkel':u.b==='CLAIROL'?'Wella Company':['L OREAL PARIS','GARNIER'].includes(u.b)?"L'Oréal CPD":''))}</td></tr>${u.subs.filter(s=>s[0]!=='*').sort((a,b)=>b[1]-a[1]).map(([s,v])=>`<tr><td style="padding-left:30px">${tracked.has(s)?'<span class="tag ok">'+esc(tc(s))+'</span>':esc(tc(s))}</td><td>$${big(v)}</td><td>${(v/utot*100).toFixed(2)}</td><td></td></tr>`).join('')}`).join('')}</tbody></table></div></div></div>`;
 $('kq').oninput=e=>{const q=e.target.value.toUpperCase();document.querySelectorAll('#kt tbody tr').forEach(tr=>tr.style.display=!q||tr.dataset.n.includes(q)||tr.textContent.toUpperCase().includes(q)?'':'none')};
 $('kres').onclick=()=>{LS.set('hcp.segmem',null);buildKB();MC.clear();renderKB();toast('Segment map reset to '+(ST.deckSeg?'deck':'defaults'))};
 document.querySelectorAll('#kt .chip').forEach(ch=>ch.onclick=()=>{const n=ch.closest('tr').dataset.n,s=ch.dataset.s;const a=SEGMEM[s]||(SEGMEM[s]=[]);SEGMEM[s]=a.includes(n)?a.filter(x=>x!==n):[...a,n];ch.classList.toggle('on');LS.set('hcp.segmem',SEGMEM)})}

/* ===================== shell ===================== */
function renderControls(){if(!ST.cube){$('ctl').innerHTML='';return}
 $('ctl').innerHTML=`<label>Period <select id="per">${ST.pers.map(p=>`<option value="${p.k}" ${p.k===ST.per?'selected':''}>${esc(p.k==='m'?ST.label+' · '+p.label:p.label)}</option>`).join('')}</select></label>
 <label>Market <select id="mkt">${ST.mkts.slice().sort((a,b)=>mgroup(a).localeCompare(mgroup(b))).map(m=>`<option value="${esc(m)}" ${m===ST.mkt?'selected':''}>${esc(mlabel(m))}</option>`).join('')}</select></label>`;
 $('per').onchange=e=>{ST.per=e.target.value;render()};$('mkt').onchange=e=>{ST.mkt=e.target.value;render()}}
function renderEmpty(){const u=LS.get('hcp.universe',null);
 $('app').innerHTML=`<div class="drop"><b>Drop the TL MASS HC BY PERIOD workbook here</b><div class="mut">NielsenIQ export with Products · Markets · Periods · Facts columns. Read entirely in your browser — nothing is uploaded.</div>
 <div style="margin-top:16px"><button class="btn pri" onclick="$('file').click()">Choose file(s)</button></div>
 <div class="files"><span class="tag no">TL MASS HC file — not loaded</span><span class="tag ok">Brand universe — ${ST.uniFile?esc(ST.uniFile):'built-in ('+ST.universe.length+' brand/sub-brand lines)'}</span></div>
 <div class="hint" style="max-width:640px;margin:18px auto 0">You can drop both files at once: the TL file drives every tab, the brand universe table (BRAND / SUB BRAND / $) refreshes the knowledge base.</div></div>`}
function render(){MC.clear();document.querySelectorAll('#tabs button').forEach(b=>{b.classList.toggle('on',b.dataset.t===ST.tab);b.disabled=!ST.cube&&b.dataset.t!=='kb'});
 renderControls();kill();
 if(!ST.cube&&ST.tab!=='kb')return renderEmpty();
 ({note:renderNote,ov:renderOverview,seg:renderSegments,br:renderBrands,mk:renderMarkets,kb:renderKB})[ST.tab]()}
(function init(){const u=LS.get('hcp.universe',null);if(u&&u.rows&&u.rows.length){ST.universe=u.rows;ST.uniFile=u.file}
 const t=LS.get('hcp.theme',null);if(t)document.documentElement.dataset.theme=t;
 $('theme').onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;const n=dark?'light':'dark';document.documentElement.dataset.theme=n;LS.set('hcp.theme',n);render()};
 $('upl').onclick=()=>$('file').click();$('file').onchange=e=>{handleFiles(e.target.files);e.target.value=''};
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{ST.tab=b.dataset.t;render()});
 addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('dragging')});
 addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('dragging')});
 addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('dragging');handleFiles(e.dataTransfer.files)});
 render()})();
</script>
