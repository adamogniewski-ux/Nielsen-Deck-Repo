<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hair Colour Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* ============ Liquid-glass design tokens ============ */
:root{
 --bg1:#dfe7ff;--bg2:#fbe3f1;--bg3:#dcf5ec;--blob:.70;
 --glass:rgba(255,255,255,.52);--glass2:rgba(255,255,255,.74);--glass3:rgba(255,255,255,.88);
 --bd:rgba(255,255,255,.72);--bd2:rgba(20,30,70,.10);--hi:rgba(255,255,255,.95);
 --txt:#121420;--mut:#5d6274;--faint:#8b90a2;
 --pos:#13803a;--neg:#cf2738;--warn:#a86400;--acc:#2456e6;--acc2:rgba(36,86,230,.12);--cpd:#2456e6;
 --posbg:rgba(19,128,58,.13);--negbg:rgba(207,39,56,.12);
 --sh:0 10px 40px rgba(28,38,92,.13),0 2px 6px rgba(28,38,92,.06);
 --stick:rgba(246,248,255,.86);--row:rgba(255,255,255,.0);--rowh:rgba(255,255,255,.55);--grid:rgba(20,30,70,.08);
 --paper:rgba(255,255,255,.80);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg1:#0a0d1c;--bg2:#1b0f26;--bg3:#07171b;--blob:.42;
 --glass:rgba(38,42,62,.46);--glass2:rgba(58,62,86,.58);--glass3:rgba(44,48,68,.86);
 --bd:rgba(255,255,255,.13);--bd2:rgba(255,255,255,.08);--hi:rgba(255,255,255,.22);
 --txt:#f2f3f7;--mut:#a6aabb;--faint:#767b8e;
 --pos:#3fd273;--neg:#ff5b67;--warn:#ffb54a;--acc:#7b98ff;--acc2:rgba(123,152,255,.16);--cpd:#7b98ff;
 --posbg:rgba(63,210,115,.15);--negbg:rgba(255,91,103,.15);
 --sh:0 12px 44px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
 --stick:rgba(30,33,50,.92);--rowh:rgba(255,255,255,.05);--grid:rgba(255,255,255,.08);--paper:rgba(30,33,48,.82)}}
:root[data-theme="dark"]{
 --bg1:#0a0d1c;--bg2:#1b0f26;--bg3:#07171b;--blob:.42;
 --glass:rgba(38,42,62,.46);--glass2:rgba(58,62,86,.58);--glass3:rgba(44,48,68,.86);
 --bd:rgba(255,255,255,.13);--bd2:rgba(255,255,255,.08);--hi:rgba(255,255,255,.22);
 --txt:#f2f3f7;--mut:#a6aabb;--faint:#767b8e;
 --pos:#3fd273;--neg:#ff5b67;--warn:#ffb54a;--acc:#7b98ff;--acc2:rgba(123,152,255,.16);--cpd:#7b98ff;
 --posbg:rgba(63,210,115,.15);--negbg:rgba(255,91,103,.15);
 --sh:0 12px 44px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
 --stick:rgba(30,33,50,.92);--rowh:rgba(255,255,255,.05);--grid:rgba(255,255,255,.08);--paper:rgba(30,33,48,.82)}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--txt);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45;letter-spacing:-.006em;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
 background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:var(--blob);z-index:-1;pointer-events:none;animation:drift 26s ease-in-out infinite alternate}
.b1{width:46vw;height:46vw;background:#7aa0ff;top:-14vw;left:-10vw}
.b2{width:40vw;height:40vw;background:#ff94d2;bottom:-16vw;right:-8vw;animation-duration:32s}
.b3{width:30vw;height:30vw;background:#62e3bf;top:38vh;left:44vw;animation-duration:38s}
@keyframes drift{to{transform:translate(7vw,5vh) scale(1.18)}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}*{transition:none!important}}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* glass surface */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh),inset 0 1px 0 var(--hi),inset 0 -1px 0 rgba(255,255,255,.05)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(520px circle at var(--mx,30%) var(--my,-40%),rgba(255,255,255,.22),transparent 60%)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,0) 32%);mix-blend-mode:soft-light}
.glass>*{position:relative;z-index:1}
/* header */
header{position:sticky;top:10px;z-index:40;margin:10px auto 0;max-width:1560px;width:calc(100% - 20px);border-radius:22px}
.bar{display:flex;gap:10px 12px;align-items:center;flex-wrap:wrap;padding:8px 10px}
.brand{border:0;background:none;color:inherit;cursor:pointer;font-family:inherit;border-radius:12px;padding:4px 8px!important;transition:background .2s}
.brand:hover{background:rgba(120,125,150,.14)}
.brand{font-weight:800;letter-spacing:-.025em;font-size:16px;display:flex;align-items:center;gap:9px;padding:0 6px}
.brand i{width:24px;height:24px;border-radius:8px;background:conic-gradient(from 200deg,#6b4bff,#ff6fae,#ffb35c,#4fd1c5,#6b4bff);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 3px 10px rgba(107,75,255,.35);display:inline-block}
.seg{position:relative;display:flex;padding:3px;border-radius:99px;background:rgba(120,125,150,.14);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;z-index:1;background:none;border:0;padding:7px 14px;border-radius:99px;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap;transition:color .25s}
.seg button.on{color:var(--txt)}
.seg button:disabled{opacity:.38;cursor:default}
.seg .thumb{position:absolute;top:3px;bottom:3px;border-radius:99px;background:var(--glass3);box-shadow:0 2px 10px rgba(0,0,0,.12),inset 0 1px 0 var(--hi);transition:left .42s cubic-bezier(.3,1.3,.5,1),width .42s cubic-bezier(.3,1.3,.5,1);z-index:0}
.seg.sm button{padding:4px 11px;font-size:12px}
.sp{flex:1}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl{font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
select,input[type=text],input[type=search]{border:1px solid var(--bd);background:var(--glass2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:99px;padding:6px 12px;outline:none;max-width:100%;box-shadow:inset 0 1px 0 var(--hi)}
#ctl select{max-width:200px}
.btn{border:1px solid var(--bd);background:var(--glass2);border-radius:99px;padding:7px 14px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:inset 0 1px 0 var(--hi),0 2px 8px rgba(0,0,0,.06);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 var(--hi),0 6px 18px rgba(0,0,0,.12)}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,#4a78ff,#2456e6);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(36,86,230,.38),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.sm{padding:4px 10px;font-size:12px}
main{max-width:1560px;margin:0 auto;padding:16px 20px 80px}
.pad{padding:18px 20px}
h2{font-size:24px;letter-spacing:-.03em;margin:0 0 2px}
h3{font-size:15px;margin:0 0 10px;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.mut{color:var(--mut)}.faint{color:var(--faint)}.sm{font-size:12px}small{font-size:11px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
@media(max-width:1000px){.g2{grid-template-columns:1fr}}
.mb{margin-bottom:14px}
.pagehead{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin:6px 4px 14px}
.pagehead p{margin:2px 0 0;color:var(--mut)}
.kpi .n{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
.kpi .v{font-size:32px;font-weight:800;letter-spacing:-.04em;margin:4px 0 2px}
.kpi .c{font-size:13px;font-weight:600}
.drop{padding:64px 20px;text-align:center}
.drop b{font-size:22px;display:block;margin-bottom:6px;letter-spacing:-.025em}
body.dragging .drop{outline:2px dashed var(--acc);outline-offset:-10px}
.files{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--bd);background:var(--glass2);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.ok::before,.tag.no::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pos)}
.tag.no::before{background:var(--faint)}
.src{display:inline-block;font-size:10px;font-weight:700;color:var(--acc);background:var(--acc2);border-radius:5px;padding:0 5px;margin-left:4px;vertical-align:1px;letter-spacing:.02em}
.pill{display:inline-block;font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 8px;margin:0 3px 0 0;white-space:nowrap}
.p-pos{background:var(--posbg);color:var(--pos)}.p-neg{background:var(--negbg);color:var(--neg)}.p-new{background:var(--acc2);color:var(--acc)}.p-warn{background:rgba(168,100,0,.13);color:var(--warn)}.p-mut{background:rgba(120,125,150,.15);color:var(--mut)}
/* tables */
.tw{overflow:auto;max-height:74vh;border-radius:16px}
.tw.flat{max-height:none}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:6px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid)}
thead th{position:sticky;top:0;background:var(--stick);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);z-index:3;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
thead tr.h2 th{top:27px}
th.sortable{cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:2;background:var(--stick)}
thead th:first-child{z-index:4}
tbody tr:hover td{background:var(--rowh)}
tbody tr:hover td:first-child{background:var(--stick)}
tr.sec td{background:var(--acc2)!important;font-weight:800;color:var(--txt);text-transform:uppercase;letter-spacing:.04em;font-size:11.5px}
tr.sub td{font-weight:700;color:var(--mut)}
tr.grp td{font-weight:700;color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;text-align:left;background:var(--stick)}
td.l{text-align:left}
th.gs,td.gs{border-left:1px solid var(--grid)}
th.sel,td.sel{background-image:linear-gradient(var(--acc2),var(--acc2))}
.cpd td:first-child{box-shadow:inset 3px 0 0 var(--cpd)}
.lv0 td:first-child{font-weight:700}.lv1 td:first-child{font-weight:600}
.tree{cursor:pointer;display:inline-block;width:16px;color:var(--faint)}
.wrap td:first-child{white-space:normal;min-width:200px}
.btn.ico{width:36px;height:36px;padding:0;display:inline-grid;place-items:center;font-size:16px}
/* highlights */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0;overflow:hidden;margin-bottom:16px;min-height:250px}
.hero .txt{padding:28px 30px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.hero .eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.hero h1{font-size:clamp(24px,3vw,36px);line-height:1.08;letter-spacing:-.035em;margin:0}
.hero .sub{color:var(--mut);font-size:14px;max-width:560px}
.hero .kp{display:flex;gap:22px;flex-wrap:wrap;margin-top:6px}
.hero .kp div{display:flex;flex-direction:column}.hero .kp b{font-size:22px;letter-spacing:-.03em}.hero .kp span{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.hero .art{position:relative;min-height:220px}
.hero .art img,.hero .art svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hero .art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--glass) 0%,transparent 35%);pointer-events:none}
@media(max-width:820px){.hero{grid-template-columns:1fr}.hero .art{min-height:170px;order:-1}.hero .art::after{background:linear-gradient(0deg,var(--glass),transparent 45%)}}
.ins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:1100px){.ins{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.ins{grid-template-columns:1fr}}
.icard{display:flex;flex-direction:column;overflow:hidden;padding:0}
.icard .pic{height:118px;position:relative;overflow:hidden;border-radius:22px 22px 0 0}
.icard .pic img,.icard .pic svg{width:100%;height:100%;object-fit:cover;display:block}
.icard .pic .badge{position:absolute;left:12px;top:12px}
.icard .bd{padding:14px 18px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.icard .big{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1}
.icard h4{margin:0;font-size:15.5px;letter-spacing:-.02em;line-height:1.25}
.icard .why{font-size:13px;color:var(--mut)}
.icard .act{margin-top:auto;font-size:12.5px;font-weight:600;border-top:1px solid var(--grid);padding-top:9px}
.icard .act::before{content:"→ ";color:var(--acc)}
.tone{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;border-radius:99px;padding:4px 10px;background:var(--glass3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tone i{width:7px;height:7px;border-radius:50%;display:inline-block}
.t-opp i{background:var(--pos)}.t-risk i{background:var(--neg)}.t-watch i{background:var(--warn)}
.signals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.signals div{font-size:13px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.16);border:1px solid var(--bd2)}
.gal{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.gal figure{margin:0;width:92px;text-align:center;font-size:10.5px;color:var(--mut)}
.gal img{width:92px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--bd);display:block;margin-bottom:3px}
/* note */
.notewrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media(max-width:1100px){.notewrap{grid-template-columns:1fr}}
.paper{background:var(--paper);padding:34px 40px;font-size:13.5px;line-height:1.5;outline:none;border-radius:22px}
@media(max-width:640px){.paper{padding:20px 16px}main{padding:14px 12px 60px}}
.paper h1{font-size:22px;margin:0 0 2px;letter-spacing:-.025em}
.paper .meta{color:var(--mut);font-size:12px;margin-bottom:16px}
.paper h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;margin:22px 0 4px;color:var(--acc);border-bottom:2px solid var(--acc);padding-bottom:4px;display:flex;justify-content:space-between;gap:10px}
.paper h4 small{color:var(--mut);font-weight:600;letter-spacing:.02em;text-transform:none}
.paper h5{font-size:13px;margin:12px 0 2px}
.paper p.lead{margin:8px 0;font-weight:600}
.paper ul{margin:4px 0;padding-left:20px}.paper li{margin:3px 0}
.paper hr{border:0;border-top:1px dashed var(--grid);margin:16px 0}
.paper .k{font-weight:700}
.side .glass{margin-bottom:14px}
.side ul{padding-left:18px;margin:6px 0}.side li{margin:4px 0}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--glass2);border-radius:99px;padding:2px 9px;font-size:11px;font-weight:600;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chartbox{position:relative;height:300px}
.bars .row{display:grid;grid-template-columns:150px 1fr 96px;gap:8px;align-items:center;margin:6px 0;font-size:12.5px}
.bars .track{height:10px;background:rgba(120,125,150,.15);border-radius:99px;position:relative;overflow:hidden}
.bars .fill{position:absolute;top:0;bottom:0;border-radius:99px}
/* consumer + news cards */
.need h3{font-size:16px}
.need .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
@media(max-width:700px){.need .cols{grid-template-columns:1fr}}
.need .box{background:rgba(255,255,255,.18);border:1px solid var(--bd2);border-radius:14px;padding:10px 12px}
.need .box b.t{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin-bottom:4px}
.need ul{margin:0;padding-left:16px}.need li{margin:3px 0;font-size:13px}
.stat{font-weight:800;letter-spacing:-.02em}
.verdict{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;border-radius:99px;padding:3px 10px;text-transform:uppercase;letter-spacing:.05em}
.v-ok{background:var(--posbg);color:var(--pos)}.v-mix{background:rgba(168,100,0,.14);color:var(--warn)}.v-no{background:var(--negbg);color:var(--neg)}
.so{margin-top:10px;font-size:13px;border-left:3px solid var(--acc);padding:4px 0 4px 10px}
.news .item{padding:14px 16px}
.news .item h4{margin:4px 0 6px;font-size:15px;letter-spacing:-.015em}
.news .item a{color:var(--acc);text-decoration:none;font-weight:600}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--glass3);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--bd);color:var(--txt);padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;box-shadow:var(--sh);max-width:92vw}
.toast.on{opacity:1}
.loading{display:none;position:fixed;inset:0;background:rgba(10,12,30,.18);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:90;place-items:center}
.loading.on{display:grid}
.loading .glass{padding:18px 26px;font-weight:700}
.hint{font-size:12px;color:var(--mut)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
@media print{header,.side,.noprint,.blob{display:none!important}main{padding:0;max-width:none}.notewrap{display:block}.paper,.glass{box-shadow:none!important;border:0!important;background:#fff!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<header class="glass"><div class="bar">
  <button class="brand" id="home" title="Home — upload or replace files" aria-label="Home"><i></i>Hair Colour Pulse</button>
  <div class="seg" id="tabs" role="tablist"><div class="thumb"></div>
    <button data-t="hi" class="on">Highlights</button>
    <button data-t="deck">Deck</button>
    <button data-t="seg">Segments</button>
    <button data-t="br">Brands</button>
    <button data-t="mk">Markets</button>
    <button data-t="cx">Consumer</button>
    <button data-t="news">News</button>
    <button data-t="note">Monthly Note</button>
  </div>
  <div class="sp"></div>
  <div class="ctl" id="ctl"></div>
  <input type="file" id="file" accept=".xlsx,.xls,.pdf,.json,image/*" multiple hidden>
  <button class="btn pri" id="upl">Upload</button>
  <button class="btn ico" id="theme" title="Toggle light / dark" aria-label="Toggle light or dark theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</div></header>
<main id="app"></main>
<div class="toast" id="toast" role="status"></div>
<div class="loading" id="loading"><div class="glass" id="loadmsg">Reading workbook…</div></div>
<script>
'use strict';
/* =====================================================================

function insights(){const k=ST.per,M=get('MASS');if(!M||!M.hasYA)return[];const Mm=mv(M);const out=[];const L=k==='m'?ST.label:perShort(k);
 const cpd=get('CPD'),Cm=mv(cpd);const fs=franchiseSet();
 /* 1 category */
 const mix=fin(M.dp)&&fin(M.up)?M.dp-M.up:0;
 out.push({tone:Mm.p>=0?'opp':'risk',tag:'Category',big:sp(Mm.p),p:null,seed:'cat'+L,title:`Mass Hair Colour ${Mm.p>=0?'is growing':'is declining'} in ${L}`,
  why:`${ML()} ${fV(Mm.v)} (${fC(Mm.c)}); ${isD()?'units':'$'} ${sp(Mm.op)}; avg $/unit ${sp(M.prp)}.`,
  act:Math.abs(mix)<1.5?'Growth is volume-led — keep availability and in-store visibility strong.':mix>0?'Growth is price/mix-led — watch unit elasticity before the next price move.':'Units outpace $ — shoppers are trading down; protect value packs and entry price points.'});
 /* 2 CPD share */
 if(cpd&&fin(Cm.sc)){const mm=ST.mkts.filter(m=>m!==ST.nat&&get('MASS',m)&&get('MASS',m).d>=get('MASS',ST.nat).d*0.03&&get('CPD',m)&&mgroup(m)!=='3 Regions'&&mgroup(m)!=='4 SDM regions');
  const sh=mm.map(m=>[m,mv(get('CPD',m)).sc]).filter(a=>fin(a[1])).sort((a,b)=>a[1]-b[1]);const lo=sh[0],hi=sh[sh.length-1];
  out.push({tone:Cm.sc>=0.05?'opp':Cm.sc<=-0.05?'risk':'watch',tag:'CPD share',big:spp(Cm.sc),p:'CPD',seed:'cpd'+L,title:`CPD ${Cm.sc>=0?'gained':'lost'} share — now ${f1(Cm.s)}%`,
   why:`${ML()} ${sp(Cm.p)} vs category ${sp(Mm.p)}.${hi&&hi[1]>0?` Strongest in ${mshort(hi[0])} (${spp(hi[1])})`:''}${lo&&lo[1]<0?`, weakest in ${mshort(lo[0])} (${spp(lo[1])}).`:'.'}`,
   act:lo&&lo[1]<0?`Prioritise ${mshort(lo[0])}: review promo calendar, shelf and out-of-stocks.`:'Share is improving across key accounts — keep investment behind the winners.'})}
 /* 3 biggest CPD win, 4 biggest CPD drag */
 const cf=fs.filter(isCPD).map(p=>[p,contrib(p,'fr')]).filter(a=>a[1]);
 const w=rankBy(cf.filter(a=>a[1].t==='G'),a=>a[1].v)[0],d=rankBy(cf.filter(a=>a[1].t==='L'),a=>a[1].v)[0];
 if(w){const x=get(w[0]),m=mv(x);out.push({tone:'opp',tag:'CPD winner',big:ctxt(w[1]),p:w[0],title:`${fullName(w[0])} is driving CPD growth`,why:`${fC(m.c)} · ${x.isNew?'new launch':ML()+' '+sp(m.p)} · ${SL()} ${f1(m.s)} (${spp(m.sc)}).`,act:x.launch?'New launch winning — secure distribution gains and keep it visible in-store and online.':'Protect momentum: distribution, visibility and support behind it.'})}
 if(d){const x=get(d[0]),m=mv(x);out.push({tone:'risk',tag:'CPD drag',big:ctxt(d[1]),p:d[0],title:`${fullName(d[0])} is the biggest CPD drag`,why:`${fC(m.c)} · ${ML()} ${sp(m.p)} · ${SL()} ${f1(m.s)} (${spp(m.sc)}).`,act:x.delist?'Being delisted — make sure shoppers move to the replacement SKU.':'Review price, promo and shade range; check where shoppers are switching to.'})}
 /* 5 consumer need / segment outgrowing the category */
 const sg=SEGS.filter(s=>has(s.row)&&['GREY','BOLDS','ROOTS','AFG','BLEACH','AFR'].includes(s.k)).map(s=>[s,get(s.row)]).filter(a=>a[1]&&fin(mv(a[1]).p)&&a[1].ds>=3);
 const best=rankBy(sg,a=>mv(a[1]).p-Mm.p)[0];
 if(best){const[s,x]=best;const m=mv(x);const top=topBy(segCands(s.k).map(p=>[p,get(p)]).filter(a=>a[1]),a=>mv(a[1]).c);
  const theme={AFG:'gentle',AFR:'gentle',ROOTS:'roots',GREY:'grey',BOLDS:'fun',BLEACH:'fun'}[s.k];const fact=ST.ua&&ST.ua.facts.find(f=>f.k===theme&&f.stat);
  out.push({tone:m.p>Mm.p?'opp':'watch',tag:'Consumer need',big:sp(m.p),p:top?top[0]:null,seed:s.k,title:`${s.name} is ${m.p>Mm.p?'outgrowing':'tracking'} the category`,
   why:`${f1(x.ds)}% of the category, ${ML()} ${sp(m.p)} vs ${sp(Mm.p)}${top?`; led by ${fullName(top[0])}`:''}.${fact?` U&A: ${fact.stat} ${fact.label.replace(/\.$/,'')}.`:''}`,
   act:theme==='gentle'?'Lead with care credentials (no ammonia, fewer chemicals) on pack and online.':theme==='roots'?'Win the in-between occasion with quick root fixes next to permanent colour.':'Back the segment winners rather than broad range extensions.'})}
 /* 6 competitor threat */
 const comp=brandSet().filter(b=>!isCPD(b)&&b!=='HENKEL'&&b!=='CLAIROL');const cc=comp.map(b=>[b,contrib(b,'brand')]).filter(a=>a[1]&&a[1].t==='G');const th=rankBy(cc,a=>a[1].v)[0];
 if(th){const x=get(th[0]),m=mv(x);let ch='';if(ST.mkt===ST.nat&&mE()&&mB()){const e=get(th[0],mE()),b=get(th[0],mB());if(e&&b)ch=` E-Com ${sp(mv(e).p)} vs B&M ${sp(mv(b).p)}.`}
  out.push({tone:'risk',tag:'Competitor',big:ctxt(th[1]),p:th[0],title:`${pretty(th[0])} is taking the most growth`,why:`${ML()} ${sp(m.p)} · ${SL()} ${f1(m.s)} (${spp(m.sc)}).${ch}`,act:'Understand the driver (launch, price, distribution) and defend the overlapping CPD franchise.'})}
 return out}

/* U&A PDF → facts (shared with the dashboard) */
const UA_THEMES={
 home:/\bat[- ]home\b|salon|professional hairstylist|penetration|by a pro|self-colou?r|dual user/i,
 value:/price|inflation|expensive|spend|spent|\$\d|cost|on sale|promotion|coupon|less (?:often|frequently)|extending|units? (?:per|purchased|bought)|save money|cheaper/i,
 gentle:/ammonia|chemical|damage|harsh|ingredient|sustainab|gentle|scalp|cruelty|vegan|\beco/i,
 roots:/\broots?\b|touch[- ]?up/i,
 nonperm:/demi|semi[- ]?perm|non[- ]?permanent|temporary colou?r|permanent colou?r/i,
 grey:/gr[ae]y|look younger|younger look/i,
 fun:/\bfun\b|experiment|express myself|transform|bold|vibrant|several different colou?rs/i,
 digital:/online|e[- ]?com|amazon|website|social media|tiktok|youtube|instagram|facebook|virtual|digital|tutorial|quiz|review/i,
 loyal:/same brand|loyal|before entering|spur of the moment|habit|planned|always buy/i,
 switch:/switch|longer[- ]lasting|shade|end result|unexpected|assortment|too many brands/i};
function uaParse(pages,fileName){
 const clean=s=>s.replace(/\s+-\s+/g,'-').replace(/\s+/g,' ').replace(/ ([,.;:)])/g,'$1').replace(/\( /g,'(').trim();
 const readable=s=>{const t=s.replace(/\s/g,'');if(!t)return false;const ok=(t.match(/[A-Za-z0-9%$&'’().,:;\/+\-]/g)||[]).length;return ok/t.length>.85};
 const facts=[];const seen=new Set();
 const add=(k,stat,label,p,kind,delta)=>{label=clean(label);if(label.length<12||label.length>260)return;const key=(stat+'|'+label).toLowerCase();if(seen.has(key))return;seen.add(key);facts.push({k,stat,label,p,kind,...(delta?{delta}:{})})};
 const themeOf=t=>Object.keys(UA_THEMES).filter(k=>UA_THEMES[k].test(t));
 let title='',source='',method='';
 pages.forEach((raw,i)=>{const p=i+1;const lines=raw.split('\n').map(s=>s.trim()).filter(Boolean).filter(l=>!/©|Client Use Only|Strictly Confidential/i.test(l));
  const txt=clean(lines.join(' '));
  if(p<=2&&!title){const m=txt.match(/(\d{4})?\s*HAIR COLOU?R USAGE\s*&\s*ATTITUDES?[^.]*?(?:REPORT|CANADA)[^.]*?(?:\w+ \d{4})?/i);if(m)title=m[0].replace(/\s+/g,' ').trim()}
  if(!source&&/ipsos/i.test(raw))source='Ipsos';
  if(!method){const m=txt.match(/([\d,]{3,} [A-Z][a-z]+ women[^.]{0,160}\.)/);if(m)method=m[1]}
  const body=txt.split(/Base:/)[0];
  // 1) headline: last English sentence(s) before "Base:" following a "|" title
  const hl=body.split('|').pop();const hs=(hl.match(/[A-Z][^.]{25,240}\./g)||[]).filter(readable);
  const pageThemes=themeOf(hs.join(' '));
  const headline=hs.length?hs[hs.length-1]:'';
  // 2) prose sentences with numbers (executive summary style)
  const sents=txt.split(/(?<=\.)\s+(?=(?:\d+\.\s)?[A-Z])/);
  for(const s0 of sents){const s=s0.replace(/^\d+\.\s*/,'');if(!/\d+(?:\.\d+)?%|\$\d/.test(s)||!readable(s)||/[ŸźȱɁ?]|Number of Reasons|\(\w\)\s*\(\w\)|\d+%\s+[A-Z]?\s*\d+%/.test(s)||(s.match(/\d+%/g)||[]).length>4||s.split(' ').length<8)continue;
   const st=(s.match(/\$\d+(?:\.\d+)?|\d+(?:\.\d+)?%/)||[''])[0];const d=(s.match(/\(([+-]\s?\d+\s?pts?)\)/)||[])[1];
   for(const k of themeOf(s))add(k,st,s,p,'summary',d?d.replace(/\s/g,'')+' vs prior wave':null)}
  // 3) chart pairs: a run of % lines followed by the same number of label lines
  for(let j=0;j<lines.length;j++){if(!/^\d{1,3}%$/.test(lines[j]))continue;let a=j;while(a<lines.length&&/^\d{1,3}%$/.test(lines[a]))a++;const nums=lines.slice(j,a);
   if(nums.length>=3){const labs=[];let b=a;while(b<lines.length&&labs.length<nums.length+3){const l=lines[b];if(/^\d/.test(l)||/^Base:|^\*|^[A-Z]{1,3}\d|^Net\b|^\(/.test(l))break;if(/^[a-z]/.test(l)&&labs.length)labs[labs.length-1]+=' '+l;else labs.push(l);b++}
    if(labs.length>=nums.length){nums.forEach((n,x)=>{const L=labs[x];if(!readable(L)||L.length>140||/^other$/i.test(L)||/^none/i.test(L)||/since \d{4}|we have seen/i.test(L))return;const th=themeOf(L).length?themeOf(L):pageThemes;
      for(const k of th.slice(0,2))add(k,n,L+(headline?'':''),p,'chart')})}}
   j=a}
  if(headline&&p>7&&!/n=|\(\w\)\s*\(\w\)|[ŸźȹȱɁ]|\d+ \d+ \d+/.test(headline))for(const k of pageThemes.slice(0,2))add(k,'',headline,p,'headline')});
 const order={summary:0,headline:1,chart:2};
 const byK={};for(const f of facts)(byK[f.k]??=[]).push(f);
 const out=[];for(const k in byK){byK[k].sort((a,b)=>order[a.kind]-order[b.kind]||a.p-b.p);out.push(...byK[k].slice(0,6))}
 return{type:'hair-colour-ua',title:title?title.replace(/\b([A-Z])([A-Z]+)\b/g,(m,a,b)=>a+b.toLowerCase()):(fileName||'U&A report'),source:(source?source+' · ':'')+(fileName||''),method,facts:out,extracted:true}}

/* read a U&A report PDF in the browser (pdf.js loaded on demand) */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(s)})}
async function pdfPages(buf){if(!window.pdfjsLib){await loadScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'}
 const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;const out=[];
 for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();let s='';for(const it of tc.items)s+=it.str+(it.hasEOL?'\n':' ');out.push(s.replace(/[ \t]+/g,' '));$('loadmsg').textContent=`Reading U&A report… page ${i} of ${doc.numPages}`}
 return out}

   else if(x.launch&&x.dc>0)s+=`; incremental ${money(x.dc)}`;return`<li>${s}.</li>`};
  const pick=own=>{const L1=launches.filter(p=>isCPD(p)===own);const t=rankBy(fs.filter(p=>isCPD(p)===own&&get(p)&&get(p).dc>0&&!L1.includes(p)&&!L1.some(c=>ancestors(c).includes(p))),p=>get(p).dc).slice(0,Math.max(0,4-L1.length));return rankBy([...L1,...t],p=>get(p).dc).slice(0,5)};
  H.push(`<h5>CPD Performance</h5><ul>${pick(true).map(inno).join('')||'<li class="mut">No CPD launches detected.</li>'}</ul><h5>Competition Performance</h5><ul>${pick(false).map(inno).join('')||'<li class="mut">No competitor launches detected.</li>'}</ul><hr>`);
  H.push(`<h4>Competition Highlights <small>Source: Nielsen</small></h4>`);const R=get('REST OF MARKET');
  if(R&&R.hasYA)H.push(`<p class="lead">Rest of Market (excl. CPD, Wella, Henkel) ${R.dp>M.dp+2?'growing a lot faster than the category':R.dp>M.dp?'growing slightly ahead of the category':'lagging the category'} (${du(R)}, $SHR ${f1(R.ds)} ${C(R.dsc,spp(R.dsc))}).${N}</p>`);
  H.push('<ul>');
  for(const b of ['WELLA','HENKEL'].filter(has)){const x=get(b);if(!x)continue;const fr=franchiseSet().filter(p=>mfOf(p)===b).map(p=>[p,get(p)]).filter(a=>a[1]);const w=topBy(fr,a=>a[1].dc),l=botBy(fr,a=>a[1].dc);
   H.push(`<li><span class="k">${pretty(b)}</span> ($SHR ${f1(x.ds)} ${C(x.dsc,spp(x.dsc))}, ${du(x)}, ${ct(b,'mfr')})${w&&w[1].dc>0?` | ${fullName(w[0])} leading (${money(w[1].dc)})`:''}${l&&l[1].dc<0?` | ${fullName(l[0])} biggest drainer (${money(l[1].dc)}${l[1].delist?', delisting':''})`:''}</li>`)}
  const brs=brandSet(),comp=brs.filter(b=>!isCPD(b)&&b!=='HENKEL'&&b!=='CLAIROL');topC=rankBy(comp.filter(b=>get(b)?.dc>0),b=>get(b).dc).slice(0,3);
  for(const b of topC){const x=get(b);const r=rankOf(b,brs,p=>get(p)?.dc);let ch='';if(mk===ST.nat&&mE()&&mB()){const e=get(b,mE()),bm=get(b,mB());if(e&&bm)ch=` (E-Com $ ${C(e.dp,sp(e.dp))} & B&M $ ${C(bm.dp,sp(bm.dp))})`}
   H.push(`<li><span class="k">${pretty(b)}</span>: the ${ord(r)} contributor brand growing $ ${C(x.dp,sp(x.dp))}${ch} @ ${ct(b,'brand')} ($SHR ${f1(x.ds)})</li>`)}
  const mom=rankBy(comp.filter(b=>!topC.includes(b)&&get(b)&&get(b).ds>=1&&fin(get(b).dp)&&get(b).dp>M.dp+5),b=>get(b).dp)[0];
  if(mom){const x=get(mom);H.push(`<li><span class="k">${pretty(mom)}</span>: strong run ($SHR ${f1(x.ds)}, $ ${C(x.dp,sp(x.dp))}, U ${C(x.up,sp(x.up))})</li>`)}
  const dr=botBy(comp.map(b=>[b,get(b)]).filter(a=>a[1]),a=>a[1].dc);if(dr&&dr[1].dc<0)H.push(`<li><span class="k">${pretty(dr[0])}</span>: biggest competitor drainer at ${money(dr[1].dc)} (${du(dr[1])}, ${ct(dr[0],'brand')})</li>`);
  if(mk===ST.nat){const ex=rankBy(comp.map(b=>[b,exclusivity(b)]).filter(a=>a[1]&&get(a[0])?.ds>=0.1),a=>get(a[0]).ds).slice(0,4);
   if(ex.length)H.push(`<li><span class="k">Note on retailer-exclusive brands:</span> ${ex.map(([b,ban])=>{const x=get(b);return`${pretty(b)} (${ban}) $ ${C(x.dp,sp(x.dp))}, ${ct(b,'brand')}${x.ds<0.5?', but only '+f1(x.ds)+' $SHR':', $SHR '+f1(x.ds)}`}).join('. ')}.</li>`)}
  H.push('</ul><hr>')}
 H.push(`<h4>So What — Implications for CPD <small>Auto-generated</small></h4><ul>`);
 if(cpd&&cpd.hasYA){H.push(`<li>CPD ${cpd.dsc>=0?'gained':'lost'} <b>${f1(Math.abs(cpd.dsc))} pts</b> of $ share${mktName} (now ${f1(cpd.ds)}%). Avg $/unit ${sp(cpd.prp)} vs category ${sp(M.prp)}${fin(cpd.prp)&&fin(M.prp)?(cpd.prp>M.prp+1?' — CPD is pricing ahead of the market; watch unit elasticity.':cpd.prp<M.prp-1?' — CPD is pricing below the market trend.':' — in line with the market.'):''}</li>`);
  if(mk===ST.nat){const mm=ST.mkts.filter(m=>m!==ST.nat&&get('MASS',m)&&get('MASS',m).d>=M.d*0.03&&get('CPD',m));const sh=mm.map(m=>[m,get('CPD',m).dsc]).filter(a=>fin(a[1])).sort((a,b)=>a[1]-b[1]);
   if(sh.length){const lo=sh.slice(0,3).filter(a=>a[1]<0),hi=sh.slice(-3).reverse().filter(a=>a[1]>0);
    if(hi.length)H.push(`<li>Share gains strongest in ${hi.map(a=>`<b>${mshort(a[0])}</b> ${C(a[1],spp(a[1]))}`).join(', ')}.</li>`);
    if(lo.length)H.push(`<li>Share losses concentrated in ${lo.map(a=>`<b>${mshort(a[0])}</b> ${C(a[1],spp(a[1]))}`).join(', ')} — priority for activation/promo review.</li>`)}}
  const sg=segs.filter(g=>fin(g.cshrc));if(sg.length){const a=sg.slice().sort((x,y)=>y.cshrc-x.cshrc);H.push(`<li>Segment share: CPD ${a[0].cshrc>=0?'gaining':'losing'} most in <b>${a[0].s.name}</b> ${C(a[0].cshrc,spp(a[0].cshrc))}${a.length>1?`; weakest in <b>${a[a.length-1].s.name}</b> ${C(a[a.length-1].cshrc,spp(a[a.length-1].cshrc))}`:''}.</li>`)}
  if(topC[0])H.push(`<li>Biggest competitive threat: <b>${pretty(topC[0])}</b> at ${ct(topC[0],'brand')} of brand-level growth${get(topC[0]).dsc>0?` (+${f1(get(topC[0]).dsc)} pts share)`:''}.</li>`);
  if(ST.ua){const ns=needStates().filter(n=>n.verdict==='ok').slice(0,3);if(ns.length)H.push(`<li>Consumer read-across (U&A): sales confirm ${ns.map(n=>'<b>'+esc(n.name.toLowerCase())+'</b>').join(', ')} — see the Consumer tab.</li>`)}}
 H.push('</ul>');
 H.push(`<p class="faint sm" style="margin-top:18px">Definitions: WOB = segment $ weight of business in Mass HC · CTG = item $ gain ÷ total absolute $ gains of comparable lines; CTL = item $ loss ÷ total absolute $ losses · $SHR/USHR = $ / unit share of Mass HC · pts = share change vs year ago · Launch = little/no year-ago sales or ≥ +300% growth. Atlas360 and promo data are not in the Nielsen file — add them manually where needed.</p>`);
 return H.join('')}
function renderNote(){$('app').innerHTML=`<div class="notewrap"><div><div class="paper glass" id="paper" contenteditable="true" spellcheck="false">${noteHTML()}</div></div>
 <div class="side noprint"><div class="glass pad"><h3>Note controls</h3><div class="hint mb">Regenerates when you change period or market. Click into the page to edit before copying.</div>
  <label class="lbl" style="display:block;margin-bottom:10px">Period label<br><input type="text" id="plabel" value="${esc(ST.label)}" style="width:100%;margin-top:4px"></label>
  <div class="ctl"><button class="btn pri" id="copy">Copy note</button><button class="btn" id="print">Print / PDF</button><button class="btn" id="regen">Reset edits</button></div></div>
  <div class="glass pad"><h3>Scorecard</h3><div id="score"></div></div>
  <div class="glass pad"><h3>What feeds the note</h3><ul class="sm mut"><li>Category, channel and CPD lines: MASS, B&M, E-Com, CPD and brand rows.</li><li>CTG/CTL: share of total absolute gains/losses among comparable lines.</li><li>Segment winners/drainers: the segment map in Knowledge.</li><li>Launches: no/low year-ago base or ≥ +300%.</li></ul></div></div></div>`;
 $('plabel').onchange=e=>{ST.label=e.target.value||ST.label;const m=ST.pers.find(p=>p.k==='m');LS.set('hcp.label.'+(m?m.label:''),ST.label);render()};
 $('regen').onclick=()=>{$('paper').innerHTML=noteHTML();toast('Note regenerated')};$('print').onclick=()=>print();
 $('copy').onclick=async()=>{const el=$('paper');const html=`<div style="font-family:Arial,sans-serif;font-size:11pt">${el.innerHTML.replace(/<span class="src">/g,'<span style="color:#2456e6;font-size:8pt">[').replace(/Nielsen<\/span>/g,'Nielsen]</span>').replace(/class="pos"/g,'style="color:#13803a"').replace(/class="neg"/g,'style="color:#cf2738"')}</div>`;
  try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([el.innerText],{type:'text/plain'})})]);toast('Copied — paste into email, Word or PowerPoint')}
  catch(e){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');s.removeAllRanges();toast('Copied')}};
 const rows=[['Mass HC','MASS'],['CPD','CPD'],["L'Oréal Paris",'L OREAL PARIS'],['Garnier','GARNIER'],['Wella (Clairol)','WELLA'],['Henkel','HENKEL'],['Rest of Market','REST OF MARKET']].filter(r=>has(r[1])&&get(r[1]));
 $('score').innerHTML=`<table><thead><tr><th></th><th>$SHR</th><th>$ %</th><th>U %</th></tr></thead><tbody>${rows.map(([n,p])=>{const x=get(p);return`<tr><td>${n}</td><td>${f1(x.ds)}</td><td class="${cls(x.dp)}">${sp(x.dp)}</td><td class="${cls(x.up)}">${sp(x.up)}</td></tr>`}).join('')}</tbody></table>`}

function segInit(id,on){const s=$(id);if(!s)return;const t=s.querySelector('.thumb');const place=()=>{const b=s.querySelector('button.on');if(b&&t){t.style.left=b.offsetLeft+'px';t.style.width=b.offsetWidth+'px';t.style.opacity=1}else if(t)t.style.opacity=0};
 requestAnimationFrame(place);s.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.disabled)return;s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));place();on(b.dataset.v||b.dataset.t)})}
function renderControls(){if(!ST.cube){$('ctl').innerHTML='';return}
 $('ctl').innerHTML=`<div class="seg sm" id="meas" title="Switch $ / units"><div class="thumb"></div><button data-v="d" class="${isD()?'on':''}">$</button><button data-v="u" class="${!isD()?'on':''}">Units</button></div>
 <select id="per" aria-label="Period">${ST.pers.map(p=>`<option value="${p.k}" ${p.k===ST.per?'selected':''}>${esc(p.k==='m'?ST.label+' · '+p.label:p.label)}</option>`).join('')}</select>
 <select id="mkt" aria-label="Market">${ST.mkts.slice().sort((a,b)=>mgroup(a).localeCompare(mgroup(b))).map(m=>`<option value="${esc(m)}" ${m===ST.mkt?'selected':''}>${esc(mlabel(m))}</option>`).join('')}</select>`;
 segInit('meas',v=>{ST.meas=v;LS.set('hcp.meas',v);render()});
 $('per').onchange=e=>{ST.per=e.target.value;render()};$('mkt').onchange=e=>{ST.mkt=e.target.value;render()}}
function renderHome(){const fmt=t=>t?new Date(t).toLocaleString('en-CA',{dateStyle:'medium',timeStyle:'short'}):'';
 $('app').innerHTML=`<div class="glass drop"><b>${ST.cube?'Upload new files':'Upload the Nielsen Deck and the U&A report'}</b><div class="mut">Nielsen Deck (.xlsx) and U&A report (.pdf) — read entirely in your browser, nothing leaves your computer.</div>
 <div class="ctl" style="justify-content:center;margin-top:18px"><button class="btn pri" id="hpick">Choose file(s)</button>${ST.cube?'<button class="btn" id="hopen">Open dashboard →</button>':''}</div>
 <div class="files"><span class="tag ${ST.cube?'ok':'no'}">Nielsen data — ${ST.cube?esc(ST.file)+(ST.savedAt?' · '+esc(fmt(ST.savedAt)):''):'not loaded'}</span><span class="tag ${ST.ua?'ok':'no'}">Consumer U&A — ${ST.ua?esc(ST.ua.title):'upload the report PDF'}</span><span class="tag ${ST.uniFile?'ok':'no'}">Brand universe — ${ST.uniFile?esc(ST.uniFile):'names built in'}</span><span class="tag ${Object.keys(IMG).length?'ok':'no'}">Photos — ${Object.keys(IMG).length?Object.keys(IMG).length+' added':'optional'}</span></div>
 <div class="ctl" style="justify-content:center;margin-top:12px">${ST.cube?'<button class="btn sm" id="hclr">Clear Nielsen data</button>':''}${ST.ua?'<button class="btn sm" id="hua">Remove U&A</button>':''}${Object.keys(IMG).length?'<button class="btn sm" id="himg">Remove images</button>':''}<button class="btn sm" id="hkb">Knowledge base</button></div>
 ${Object.keys(IMG).length?`<div class="gal">${Object.entries(IMG).map(([k,u])=>`<figure><img src="${u}" alt=""><figcaption>${esc(k==='hero'?'Banner':pretty(k))}</figcaption></figure>`).join('')}</div>`:''}
 <div class="hint" style="max-width:660px;margin:18px auto 0">Drop several files at once: a new Nielsen Deck workbook (or TL MASS HC file) replaces the current data and drives every tab; the U&A report PDF adds the consumer lens; the BRAND / SUB BRAND / $ table sizes the universe. <b>Photos:</b> drop approved brand images (.jpg/.png) named after the brand or franchise — e.g. <i>casting.jpg</i>, <i>garnier.png</i>, <i>hero.jpg</i> for the banner — and they appear on the Highlights cards. Everything stays in this browser.</div></div>`;
 $('hpick').onclick=()=>$('file').click();
 if($('hopen'))$('hopen').onclick=()=>{ST.tab=LS.get('hcp.tab','hi');if(['home','kb','ov'].includes(ST.tab))ST.tab='hi';render()};

 render();
 if(location.protocol.startsWith('http')){fetch('news.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&Array.isArray(j.items)){ST.news=j;if(ST.tab==='news')render()}}).catch(()=>{});
  if(!ST.ua)fetch('ua/hair-colour-ua-2025.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.type==='hair-colour-ua'){ST.ua=j;if(['cx','note'].includes(ST.tab))render()}}).catch(()=>{})}
